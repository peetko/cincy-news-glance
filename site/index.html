<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cincy News Glance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* ---------- palette: change these to restyle everything ---------- */
  :root {
    --sky: #DCEBF3;
    --ink: #13283A;
    --muted: #3E5668;
    --river: #A9CADB;
    --city: #E3A21A;        /* City Hall marigold */
    --city-text: #8A5A00;
    --dev: #E2603C;         /* developing-story coral */
    --dev-text: #B13D1C;
    --chip: rgba(255, 255, 255, 0.82);
  }

  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Sky on top, river below, so any spare screen edges match the scene. */
  body { background: linear-gradient(var(--sky) 0 75%, var(--river) 75% 100%); cursor: default; }

  /* The whole scene is drawn at 1200x800 (a 3:2 laptop screen) and scaled to fit. */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1200px; height: 800px; overflow: hidden;
    transform-origin: center; background: var(--sky); color: var(--ink);
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  }
  .mono { font-family: 'DM Mono', ui-monospace, monospace; }
  #scene { position: absolute; inset: 0; }

  /* ---------- top bar ---------- */
  #bar {
    position: absolute; top: 30px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: flex-start; white-space: nowrap;
    font-size: 13px; letter-spacing: 0.06em; color: var(--muted);
  }
  #bar .left { display: flex; align-items: center; gap: 12px; min-height: 34px; }
  #bar .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; max-width: 330px; }
  #bar .sub { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11px; letter-spacing: 0.05em; }
  #bar .city { color: var(--ink); letter-spacing: 0.18em; }
  #wx { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  #wx svg { width: 20px; height: 20px; }
  .pill { padding: 4px 10px; border-radius: 999px; border: 1px solid #9DB2C0; font-size: 12px; letter-spacing: 0.03em; white-space: nowrap; }
  .pill.notable { border-color: var(--city); background: rgba(227,162,26,0.14); color: var(--city-text); }
  .pill.alert { border-color: var(--dev); background: rgba(226,96,60,0.12); color: var(--dev-text); }
  .stale { color: var(--dev-text); }

  /* City Hall / Biggest switch */
  .toggle { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: rgba(255,255,255,0.45); border: 1px solid #A6B9C6; }
  .toggle button { font: inherit; font-size: 12px; letter-spacing: 0.06em; color: var(--muted); background: transparent;
    border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .toggle button:hover { color: var(--ink); }
  .toggle button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(19,40,58,0.15); }
  .toggle button:focus-visible { outline: 2px solid var(--city); outline-offset: 1px; }

  /* ---------- lead story ---------- */
  #lead { position: absolute; top: 120px; left: 64px; width: 610px; display: flex; flex-direction: column; gap: 14px; transition: opacity 1.2s ease; }
  #lead.fading { opacity: 0; }
  #tag { display: flex; align-items: center; gap: 10px; white-space: nowrap; width: max-content; font-size: 13px; letter-spacing: 0.12em;
    font-family: 'DM Mono', ui-monospace, monospace; background: none; border: 0; padding: 0; margin: 0; color: inherit; text-align: left; cursor: default; }
  #tag.can-ack { cursor: pointer; }
  #tag.can-ack:hover .label { text-decoration: underline; text-underline-offset: 4px; }
  #tag .meta { color: var(--muted); letter-spacing: 0.03em; }
  #tag .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #headline { margin: 0; font-size: 42px; line-height: 1.08; font-weight: 600; letter-spacing: -0.01em;
    font-variation-settings: 'opsz' 96; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #headline a { color: inherit; text-decoration: none; }
  #headline a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
  #dek { margin: 0; font-size: 18px; line-height: 1.42; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #coverage { display: flex; gap: 6px; flex-wrap: wrap; }
  #coverage span { font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid #A6B9C6; color: #4B6274; }
  #coverage span.on, #coverage a.on { background: rgba(255,255,255,0.85); border-color: #7D93A3; color: var(--ink); }
  #coverage a { font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid #A6B9C6; text-decoration: none; }
  #coverage a.on:hover { background: #fff; border-color: #13283A; }

  /* ---------- river of headlines ---------- */
  #river { position: absolute; left: 0; right: 0; top: 614px; display: flex; flex-direction: column; gap: 20px; }
  .lane-wrap { overflow: hidden; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .lane-wrap.dragging { cursor: grabbing; }
  .lane-wrap:nth-child(2) { padding-left: 170px; }
  .lane-wrap:nth-child(3) { padding-left: 60px; }
  .lane { display: flex; gap: 22px; width: max-content; will-change: transform; }
  .chip { -webkit-user-drag: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px;
    border-radius: 999px; background: var(--chip); border: 1px solid rgba(19,40,58,0.10);
    color: var(--ink); text-decoration: none; font-size: 15px; white-space: nowrap; }
  .chip:hover { background: #fff; }
  .chip .d { width: 8px; height: 8px; border-radius: 50%; background: #6F9BB3; flex: none; }
  /* City Hall stories: a tiny City Hall in place of the dot, plus a faint warm tint */
  .chip.city { background: rgba(255, 246, 222, 0.94); border-color: rgba(201, 142, 22, 0.55); }
  .chip.city:hover { background: #FFF6DE; }
  .hall { width: 15px; height: 15px; flex: none; display: block; }
  #counts .hall { width: 13px; height: 13px; display: inline-block; vertical-align: -2px; margin: 0 5px 0 1px; }
  .chip.dev { border-color: rgba(226,96,60,0.55); }
  .chip.dev .d { background: var(--dev); }
  .chip .src { font-size: 11px; letter-spacing: 0.06em; color: #4B6274; }
  .chip .new { font-size: 10px; letter-spacing: 0.1em; color: var(--city-text); border: 1px solid var(--city); border-radius: 999px; padding: 1px 6px; }

  #empty { position: absolute; top: 160px; left: 64px; font-size: 22px; color: var(--muted); display: none; }

  /* ---------- motion ---------- */
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(1.8); } }
  @keyframes cloud { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-40px); } }
  @keyframes shimmer { 0%,100% { transform: translateX(0); opacity: .45; } 50% { transform: translateX(-20px); opacity: .9; } }
  .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .cloud { animation: cloud 90s ease-in-out infinite; }
  .sh { animation: shimmer 11s ease-in-out infinite; }
  #glow { opacity: 0; transition: opacity 3s ease; }

  /* ---------- weather in the scene: slow, faint, never the main event ---------- */
  #stage, body { transition: background 6s ease; }
  #sun { transition: opacity 6s ease; }
  #rays { opacity: 0; transform-box: view-box; transform-origin: 1070px 128px; animation: spin 200s linear infinite; transition: opacity 6s ease; }
  #sunGlow { transform-box: fill-box; transform-origin: center; animation: breathe 9s ease-in-out infinite; }
  #moreClouds, #fog, #ripples, #precip { opacity: 0; transition: opacity 6s ease; }
  #moreClouds .cl { fill: #FFFFFF; opacity: 0.75; transition: fill 6s ease; }
  #flash { opacity: 0; pointer-events: none; }
  .wx-sunny #rays { opacity: 0.55; }
  .wx-partly #moreClouds { opacity: 0.55; }
  .wx-cloudy #sun { opacity: 0.3; }
  .wx-cloudy #moreClouds, .wx-rain #moreClouds, .wx-storm #moreClouds, .wx-snow #moreClouds { opacity: 1; }
  .wx-rain #moreClouds .cl, .wx-storm #moreClouds .cl { fill: #E4EAEE; }
  .wx-rain #sun, .wx-storm #sun, .wx-snow #sun, .wx-fog #sun { opacity: 0.12; }
  .wx-rain #precip, .wx-storm #precip, .wx-snow #precip { opacity: 1; }
  .wx-rain #ripples, .wx-storm #ripples { opacity: 1; }
  .wx-fog #fog { opacity: 1; }
  .wx-storm #flash { animation: flash 41s linear infinite; }
  .fogband { animation: cloud 80s ease-in-out infinite; }
  .drop { animation: rainfall var(--d, 1.8s) linear infinite; animation-delay: var(--delay, 0s); }
  .flake { animation: snowfall var(--d, 18s) linear infinite; animation-delay: var(--delay, 0s); }
  .ripple { transform-box: fill-box; transform-origin: center; animation: ripple var(--d, 4s) ease-out infinite; animation-delay: var(--delay, 0s); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes rainfall { from { transform: translate(0, -60px); } to { transform: translate(-80px, 640px); } }
  @keyframes snowfall { 0% { transform: translate(0, -30px); } 50% { transform: translate(22px, 300px); } 100% { transform: translate(-8px, 640px); } }
  @keyframes ripple { 0% { transform: scale(0.2); opacity: 0.55; } 70%,100% { transform: scale(1.6); opacity: 0; } }
  @keyframes flash { 0%,95.6% { opacity: 0; } 96% { opacity: 0.22; } 96.5% { opacity: 0; } 97% { opacity: 0.14; } 97.6%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #precip, #ripples, #flash { display: none; } #rays, #sunGlow, .fogband { animation: none; } }
  .is-dev #glow { opacity: 0.22; }
  @media (prefers-reduced-motion: reduce) { .pulse, .cloud, .sh { animation: none; } }

  /* today's City meetings, under the lead story */
  #meetings { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; font-size: 12px; color: var(--muted); letter-spacing: 0.03em; }
  #meetings .hd { color: var(--city-text); letter-spacing: 0.12em; }
  #meetings a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted #7D93A3; }
  #meetings a:hover { border-bottom-style: solid; }
  .wx-asof { color: var(--muted); font-size: 11px; }

  /* ?debug=1 — why each story scored the way it did */
  #debug { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw); overflow: auto; z-index: 10;
    background: rgba(255,255,255,0.97); color: #13283A; font: 11px/1.45 'DM Mono', ui-monospace, monospace;
    border-left: 1px solid #A6B9C6; padding: 14px 16px 40px; box-sizing: border-box; }
  #debug h3 { font: 600 13px 'Bricolage Grotesque', sans-serif; margin: 16px 0 6px; }
  #debug .story { border-top: 1px solid #DCE5EB; padding: 8px 0; }
  #debug .t { font: 500 13px/1.3 'Bricolage Grotesque', sans-serif; }
  #debug .lead { background: #FFF6DF; }
  #debug .bad { color: #B13D1C; }
  #debug .k { color: #4B6274; }
  #debug button { font: inherit; }
</style>
</head>
<body>
<div id="stage">

  <svg id="scene" viewBox="0 0 1200 800" aria-hidden="true">
    <defs>
      <linearGradient id="glowFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F08A62" stop-opacity="0"></stop>
        <stop offset="1" stop-color="#F08A62" stop-opacity="1"></stop>
      </linearGradient>
    </defs>
    <rect x="0" y="260" width="1200" height="340" fill="url(#glowFade)" id="glow"></rect>
    <!-- sun + clouds -->
    <rect id="flash" x="0" y="0" width="1200" height="600" fill="#FFFFFF"></rect>
    <g id="sun">
      <g id="rays" stroke="#FFE7A0" stroke-width="2" stroke-linecap="round">
        <line x1="1070" y1="58" x2="1070" y2="44"></line><line x1="1070" y1="198" x2="1070" y2="212"></line>
        <line x1="1000" y1="128" x2="986" y2="128"></line><line x1="1140" y1="128" x2="1154" y2="128"></line>
        <line x1="1020.5" y1="78.5" x2="1010.6" y2="68.6"></line><line x1="1119.5" y1="177.5" x2="1129.4" y2="187.4"></line>
        <line x1="1020.5" y1="177.5" x2="1010.6" y2="187.4"></line><line x1="1119.5" y1="78.5" x2="1129.4" y2="68.6"></line>
      </g>
      <circle id="sunGlow" cx="1070" cy="128" r="58" fill="#FFF3CF" opacity="0.6"></circle>
      <circle cx="1070" cy="128" r="36" fill="#FFF3CF"></circle>
    </g>
    <g class="cloud" fill="#FFFFFF" opacity="0.85">
      <rect x="760" y="96" width="150" height="16" rx="8"></rect>
      <rect x="800" y="80" width="80" height="20" rx="10"></rect>
    </g>
    <g class="cloud" fill="#FFFFFF" opacity="0.7" style="animation-delay:-40s">
      <rect x="930" y="232" width="120" height="14" rx="7"></rect>
      <rect x="958" y="218" width="58" height="18" rx="9"></rect>
    </g>

    <!-- extra clouds for cloudy / rainy / snowy days -->
    <g id="moreClouds">
      <g class="cloud" style="animation-duration:120s;animation-delay:-20s">
        <rect class="cl" x="80" y="150" width="200" height="22" rx="11"></rect>
        <rect class="cl" x="130" y="130" width="100" height="26" rx="13"></rect>
      </g>
      <g class="cloud" style="animation-duration:140s;animation-delay:-70s">
        <rect class="cl" x="420" y="70" width="230" height="22" rx="11"></rect>
        <rect class="cl" x="480" y="50" width="120" height="26" rx="13"></rect>
      </g>
      <g class="cloud" style="animation-duration:110s;animation-delay:-50s">
        <rect class="cl" x="980" y="60" width="200" height="22" rx="11"></rect>
        <rect class="cl" x="1030" y="40" width="96" height="26" rx="13"></rect>
      </g>
      <g class="cloud" style="animation-duration:160s;animation-delay:-10s">
        <rect class="cl" x="640" y="250" width="170" height="18" rx="9"></rect>
      </g>
    </g>
    <!-- rain or snow, falling behind the hills -->
    <g id="precip"></g>

    <!-- hills: Price Hill bluff (west), the basin, Mount Adams (east) -->
    <path d="M0 430 C 90 410 170 408 260 418 C 360 430 420 452 520 458 C 640 466 780 462 900 456 C 980 452 1020 420 1090 414 C 1140 410 1180 414 1200 418 L1200 600 L0 600 Z" fill="#C8DAE1"></path>
    <path d="M0 452 C 70 436 170 430 260 440 C 310 446 340 470 380 506 C 410 532 450 544 520 546 C 640 550 820 548 920 540 C 960 530 985 490 1020 470 C 1060 452 1120 450 1200 456 L1200 600 L0 600 Z" fill="#ADC7B3"></path>
    <g fill="#9EBDA6">
      <circle cx="40" cy="452" r="9"></circle><circle cx="96" cy="444" r="8"></circle><circle cx="150" cy="440" r="9"></circle>
      <circle cx="206" cy="442" r="8"></circle><circle cx="262" cy="448" r="7"></circle><circle cx="318" cy="470" r="7"></circle>
      <circle cx="1040" cy="468" r="7"></circle><circle cx="1100" cy="458" r="8"></circle><circle cx="1156" cy="458" r="8"></circle>
    </g>
    <path d="M0 560 C 120 548 240 552 340 566 C 380 574 420 584 460 590 L1200 590 L1200 600 L0 600 Z" fill="#9CBBA4"></path>

    <!-- fog drifting over the hills -->
    <g id="fog" fill="#FFFFFF">
      <rect class="fogband" x="-100" y="452" width="760" height="26" rx="13" opacity="0.5"></rect>
      <rect class="fogband" x="520" y="486" width="820" height="30" rx="15" opacity="0.45" style="animation-delay:-30s"></rect>
      <rect class="fogband" x="120" y="530" width="900" height="28" rx="14" opacity="0.4" style="animation-delay:-60s"></rect>
    </g>

    <!-- Mount Adams church -->
    <g fill="#7D93A3">
      <rect x="1062" y="450" width="24" height="14"></rect>
      <polygon points="1060,451 1088,451 1074,443"></polygon>
      <rect x="1080" y="430" width="9" height="22"></rect>
      <polygon points="1079,431 1090,431 1084.5,416"></polygon>
    </g>

    <!-- background buildings -->
    <g fill="#AFC0CB">
      <rect x="532" y="540" width="34" height="56"></rect>
      <rect x="568" y="522" width="26" height="74"></rect>
      <rect x="690" y="528" width="26" height="68"></rect>
      <rect x="738" y="512" width="22" height="84"></rect>
      <rect x="796" y="522" width="28" height="74"></rect>
      <rect x="902" y="532" width="30" height="64"></rect>
      <rect x="936" y="548" width="34" height="48"></rect>
      <rect x="974" y="560" width="30" height="36"></rect>
    </g>

    <!-- landmark towers -->
    <g fill="#7D93A3">
      <!-- Carew Tower: stepped Art Deco crown -->
      <rect x="604" y="520" width="70" height="76"></rect>
      <rect x="620" y="446" width="40" height="76"></rect>
      <rect x="626" y="428" width="28" height="20"></rect>
      <rect x="632" y="414" width="16" height="16"></rect>
      <rect x="639" y="402" width="2" height="13"></rect>
      <!-- PNC / Central Trust Tower: pyramid top -->
      <rect x="704" y="470" width="24" height="126"></rect>
      <rect x="707" y="458" width="18" height="14"></rect>
      <polygon points="705,459 727,459 716,438"></polygon>
      <!-- Scripps Center -->
      <rect x="760" y="474" width="28" height="122"></rect>
      <rect x="764" y="464" width="20" height="12"></rect>
      <!-- Great American Tower body -->
      <rect x="826" y="410" width="30" height="186"></rect>
      <rect x="866" y="490" width="26" height="106"></rect>
    </g>
    <!-- Great American Tower tiara -->
    <g stroke="#7D93A3" stroke-width="2" stroke-linecap="round">
      <line x1="823" y1="411" x2="823" y2="404"></line>
      <line x1="828" y1="411" x2="828" y2="393"></line>
      <line x1="833" y1="411" x2="833" y2="385"></line>
      <line x1="838" y1="411" x2="838" y2="380"></line>
      <line x1="843" y1="411" x2="843" y2="379"></line>
      <line x1="848" y1="411" x2="848" y2="384"></line>
      <line x1="853" y1="411" x2="853" y2="392"></line>
      <line x1="858" y1="411" x2="858" y2="403"></line>
    </g>
    <g fill="#9AAEBC">
      <rect x="833" y="420" width="2" height="170"></rect>
      <rect x="845" y="420" width="2" height="170"></rect>
      <rect x="630" y="456" width="2" height="60"></rect>
      <rect x="646" y="456" width="2" height="60"></rect>
    </g>

    <!-- City Hall (West End): the clock face is the alert light -->
    <g fill="#7D93A3">
      <rect x="428" y="566" width="80" height="30"></rect>
      <polygon points="425,567 511,567 503,558 433,558"></polygon>
      <rect x="436" y="548" width="8" height="12"></rect>
      <polygon points="435,549 445,549 440,541"></polygon>
      <rect x="484" y="520" width="14" height="40"></rect>
      <polygon points="482,521 500,521 491,503"></polygon>
    </g>
    <circle id="clockHalo" cx="491" cy="532" r="5.5" fill="#E3A21A" opacity="0.35"></circle>
    <circle id="clockFace" cx="491" cy="532" r="3.4" fill="#E3A21A"></circle>

    <!-- river -->
    <rect x="0" y="596" width="1200" height="204" fill="#A9CADB"></rect>
    <rect x="0" y="594" width="1200" height="3" fill="#8FB0C2"></rect>

    <!-- rain ripples on the river -->
    <g id="ripples" fill="none" stroke="#FFFFFF" stroke-width="1.2"></g>

    <!-- Roebling Suspension Bridge -->
    <g fill="none" stroke="#5E89AB" stroke-width="1.6">
      <path d="M520 597 Q 545 560 563 526 Q 640 590 717 526 Q 740 560 760 597"></path>
      <path d="M520 597 Q 545 566 563 532 Q 640 594 717 532 Q 740 566 760 597" opacity="0.6"></path>
    </g>
    <line x1="510" y1="595" x2="770" y2="595" stroke="#5E89AB" stroke-width="3"></line>
    <g fill="#C7B496">
      <rect x="556" y="528" width="14" height="72"></rect>
      <rect x="710" y="528" width="14" height="72"></rect>
    </g>
    <g fill="#5E89AB">
      <circle cx="559" cy="526" r="3"></circle><circle cx="567" cy="526" r="3"></circle>
      <circle cx="713" cy="526" r="3"></circle><circle cx="721" cy="526" r="3"></circle>
    </g>

    <!-- Big Mac Bridge (east) -->
    <g fill="none" stroke="#D9AE3C" stroke-width="3" stroke-linecap="round">
      <path d="M1070 598 Q 1115 552 1160 598"></path>
      <path d="M1160 598 Q 1190 566 1220 598"></path>
    </g>
    <line x1="1050" y1="596" x2="1200" y2="596" stroke="#8FA2AF" stroke-width="2.5"></line>

    <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
      <line class="sh" x1="120" y1="606" x2="170" y2="606"></line>
      <line class="sh" x1="880" y1="608" x2="950" y2="608" style="animation-delay:-6s"></line>
      <line class="sh" x1="300" y1="788" x2="350" y2="788" style="animation-delay:-2s"></line>
      <line class="sh" x1="780" y1="792" x2="820" y2="792" style="animation-delay:-8s"></line>
    </g>
  </svg>

  <div id="bar" class="mono">
    <div class="left">
      <span class="city">CINCINNATI</span>
      <span id="date"></span><span>·</span><span id="time"></span>
      <span id="wx"></span>
      <span id="wxchange" class="pill" hidden></span>
    </div>
    <div class="right">
      <div id="mode" class="toggle" role="group" aria-label="Which story leads">
        <button type="button" data-mode="city" aria-pressed="true" title="Lead with the biggest story for City work">City Hall</button>
        <button type="button" data-mode="general" aria-pressed="false" title="Lead with the biggest story overall">Biggest</button>
      </div>
      <div class="sub"><span id="counts"></span><span id="updated"></span></div>
    </div>
  </div>

  <div id="empty">Waiting for the first headlines…</div>

  <div id="lead">
    <button id="tag" type="button"><span class="dot"></span><span class="label"></span><span class="meta"></span></button>
    <h1 id="headline"><a target="_blank" rel="noopener"></a></h1>
    <p id="dek"></p>
    <div id="coverage" class="mono"></div>
    <div id="meetings" class="mono" hidden></div>
  </div>

  <div id="river"></div>
</div>

<script>
/* ------------------------------------------------------------------
   The page reloads news.json every 5 minutes. A scheduled GitHub job
   rewrites that file every 15 minutes during work hours.
   Preview without live data:  index.html?sample=calm  or  ?sample=dev
------------------------------------------------------------------- */
const CORE_OUTLETS = ['Enquirer', 'WCPO', 'WLWT', 'FOX19', 'Local 12', 'WVXU', 'Signal'];
const REFRESH_MS = 5 * 60 * 1000;
const params = new URLSearchParams(location.search);
const DATA_URL = params.get('sample') ? `sample-${params.get('sample')}.json` : 'news.json';

const $ = (id) => document.getElementById(id);
let lastKey = '';
let lastData = null;

// Which story leads: 'city' (default) or 'general'. Remembered in this browser.
let mode = 'city';
try { mode = localStorage.getItem('leadMode') === 'general' ? 'general' : 'city'; } catch (e) {}

function setMode(next) {
  mode = next;
  try { localStorage.setItem('leadMode', mode); } catch (e) {}
  document.querySelectorAll('#mode button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  if (lastData) render(lastData);
}

// Feed text is untrusted, so it is always inserted as text, never as HTML.
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function fit() {
  const s = Math.min(innerWidth / 1200, innerHeight / 800);
  SCALE = s;
  $('stage').style.transform = `translate(-50%, -50%) scale(${s})`;
}

function tickClock() {
  const now = new Date();
  $('date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  $('time').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function clock(iso) {
  return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return `${h} hr${h > 1 ? 's' : ''} ago`;
}

/* ---------- weather icon (simple line drawings) ---------- */
function weatherIcon(short) {
  const s = (short || '').toLowerCase();
  const stroke = 'fill="none" stroke="#13283A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
  const sun = `<circle cx="10" cy="10" r="4" ${stroke}/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" ${stroke}/>`;
  const cloud = `<path d="M6 15h8.5a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6 1.4A2.8 2.8 0 0 0 6 15z" ${stroke}/>`;
  let body = sun;
  if (/thunder/.test(s)) body = cloud + `<path d="M10 15l-1.5 3h3L10 21" ${stroke}/>`;
  else if (/snow|flurr|sleet/.test(s)) body = cloud + `<path d="M7 18h.01M10 19h.01M13 18h.01" ${stroke}/>`;
  else if (/rain|shower|drizzle/.test(s)) body = cloud + `<path d="M7 17l-1 2M10 17l-1 2M13 17l-1 2" ${stroke}/>`;
  else if (/fog|haze|mist/.test(s)) body = `<path d="M3 8h14M3 11h14M5 14h10" ${stroke}/>`;
  else if (/partly|mostly sunny|mostly clear/.test(s)) body = `<g transform="translate(-2,-2) scale(.8)">${sun}</g>` + cloud;
  else if (/cloud|overcast/.test(s)) body = cloud;
  return `<svg viewBox="0 0 20 22" aria-hidden="true">${body}</svg>`;
}

/* ---------- weather in the scene ---------- */
const SKY = { sunny: '#DCEBF3', partly: '#DAE7EF', cloudy: '#D4DEE5', rain: '#CBD6DE', storm: '#C3CED7', snow: '#E0E7EC', fog: '#DCE2E6' };
const SVGNS = 'http://www.w3.org/2000/svg';
let sceneKind = null;

function weatherKind(short) {
  const s = (short || '').toLowerCase();
  if (/thunder|t-storm|storm/.test(s)) return 'storm';
  if (/snow|flurr|sleet|ice|wintry|freezing/.test(s)) return 'snow';
  if (/rain|shower|drizzle/.test(s)) return 'rain';
  if (/fog|haze|mist|smoke/.test(s)) return 'fog';
  if (/partly|mostly sunny|mostly clear/.test(s)) return 'partly';
  if (/cloud|overcast/.test(s)) return 'cloudy';
  return 'sunny';
}

function svg(tag, attrs, cls) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (cls) n.setAttribute('class', cls);
  return n;
}

function setScene(kind) {
  if (kind === sceneKind) return;
  sceneKind = kind;
  document.body.classList.remove(...Object.keys(SKY).map((k) => 'wx-' + k));
  document.body.classList.add('wx-' + kind);
  document.documentElement.style.setProperty('--sky', SKY[kind]);

  const precip = $('precip'), ripples = $('ripples');
  precip.textContent = ''; ripples.textContent = '';
  const rand = (a, b) => a + Math.random() * (b - a);
  if (kind === 'rain' || kind === 'storm') {
    const n = kind === 'storm' ? 90 : 60;
    for (let i = 0; i < n; i++) {
      const x = rand(0, 1280), y = rand(-40, 20);
      const d = svg('line', { x1: x, y1: y, x2: x - 4, y2: y + 15, stroke: '#8EAABD', 'stroke-width': 1.2, 'stroke-linecap': 'round', opacity: rand(0.25, 0.5).toFixed(2) }, 'drop');
      d.style.setProperty('--d', `${rand(1.5, 2.3).toFixed(2)}s`);
      d.style.setProperty('--delay', `${-rand(0, 2.3).toFixed(2)}s`);
      precip.append(d);
    }
    for (let i = 0; i < 10; i++) {
      const r = svg('ellipse', { cx: rand(40, 1160), cy: rand(612, 790), rx: 10, ry: 2.6 }, 'ripple');
      r.style.setProperty('--d', `${rand(3.5, 5.5).toFixed(2)}s`);
      r.style.setProperty('--delay', `${-rand(0, 5).toFixed(2)}s`);
      ripples.append(r);
    }
  } else if (kind === 'snow') {
    for (let i = 0; i < 70; i++) {
      const f = svg('circle', { cx: rand(0, 1200), cy: rand(-30, 10), r: rand(1.2, 2.8).toFixed(1), fill: '#FFFFFF', opacity: rand(0.55, 0.9).toFixed(2) }, 'flake');
      f.style.setProperty('--d', `${rand(14, 26).toFixed(1)}s`);
      f.style.setProperty('--delay', `${-rand(0, 26).toFixed(1)}s`);
      precip.append(f);
    }
  }
}

function renderWeather(w) {
  const wx = $('wx'), ch = $('wxchange');
  wx.textContent = '';
  // ?weather=rain (or sunny, partly, cloudy, storm, snow, fog) previews a scene.
  setScene(params.get('weather') || (w && w.ok ? weatherKind(w.short) : 'sunny'));
  if (!w || !w.ok) { ch.hidden = true; return; }
  wx.insertAdjacentHTML('beforeend', weatherIcon(w.short)); // icon is our own markup, not feed text
  wx.append(el('span', null, `${w.temp}° ${w.short}`));
  if (w.stale && w.as_of) wx.append(el('span', 'wx-asof', `as of ${clock(w.as_of)}`));
  const c = w.change || {};
  ch.hidden = !c.text;
  ch.textContent = c.text || '';
  ch.className = 'pill ' + (c.level === 'alert' ? 'alert' : c.level === 'notable' ? 'notable' : '');
}

/* ---------- lead story ---------- */
// "CITY HALL · CITY MANAGER", "CITY HALL · POLICE", "CITY HALL · STATE LAW"...
function cityLabel(story) {
  const why = (story.city_reasons || [])[0];
  return why && why !== 'City Hall' ? `CITY HALL · ${why.toUpperCase()}` : 'CITY HALL';
}

function renderLead(story, isDev, noCityNews) {
  const label = isDev ? 'DEVELOPING'
    : story.is_city ? cityLabel(story)
    : mode === 'general' ? 'TOP STORY'
    : 'AROUND TOWN';
  const color = isDev ? 'var(--dev)' : story.is_city ? 'var(--city)' : '#6F9BB3';
  const textColor = isDev ? 'var(--dev-text)' : story.is_city ? 'var(--city-text)' : 'var(--muted)';
  const others = story.outlet_count - 1;
  const meta = isDev
    ? `· ${story.outlet_count} newsrooms · first report ${ago(story.first_seen)} · updated ${ago(story.updated)}`
    : `· ${story.outlet}${others > 0 ? ` and ${others} other${others > 1 ? 's' : ''}` : ''} · ${ago(story.first_seen)}` +
      (noCityNews ? ' · no City Hall news yet' : '');

  const tag = $('tag');
  tag.querySelector('.dot').style.background = color;
  tag.querySelector('.label').textContent = label;
  tag.querySelector('.label').style.color = textColor;
  tag.querySelector('.meta').textContent = meta;

  const a = $('headline').querySelector('a');
  a.textContent = story.title;
  a.href = story.link;

  // Google News summaries often just repeat the headline; hide those.
  const dek = story.summary && !story.summary.toLowerCase().startsWith(story.title.toLowerCase().slice(0, 30)) ? story.summary : '';
  $('dek').textContent = dek;
  $('dek').hidden = !dek;

  const cov = $('coverage');
  cov.textContent = '';
  const extras = story.outlets.filter((o) => !CORE_OUTLETS.includes(o));
  // Outlets that covered it link to their own version of the story.
  const links = story.links || {};
  for (const o of CORE_OUTLETS.concat(extras)) {
    if (story.outlets.includes(o) && links[o]) {
      const a = el('a', 'on', o);
      a.href = links[o]; a.target = '_blank'; a.rel = 'noopener';
      a.title = `Read ${o}'s version`;
      cov.append(a);
    } else {
      cov.append(el('span', story.outlets.includes(o) ? 'on' : '', o));
    }
  }
}

/* ---------- river lanes ---------- */
// A little City Hall: building, roof, clock tower. Our own markup, never feed text.
const HALL_ICON = '<svg class="hall" viewBox="0 0 16 16" aria-hidden="true">' +
  '<path d="M1.5 14.5h13M2.6 14.5V9.6h10.8v4.9M2 9.6l1.6-1.5h8.8L14 9.6M9 8.1V4.2l1.3-2.4 1.3 2.4v3.9M5 14.5v-2.6M7 14.5v-2.6" ' +
  'fill="none" stroke="#8A5A00" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>' +
  '<circle cx="10.3" cy="5.6" r="0.95" fill="#E3A21A"/></svg>';

function chip(s, devId) {
  const a = el('a', 'chip ' + (s.id === devId ? 'dev' : s.is_city ? 'city' : 'town'));
  a.href = s.link; a.target = '_blank'; a.rel = 'noopener'; a.draggable = false;
  a.title = `${s.title} — ${s.outlets.join(', ')}` + (s.is_city ? ` (${(s.city_reasons || []).join(', ')})` : '');
  if (s.is_city && s.id !== devId) a.insertAdjacentHTML('beforeend', HALL_ICON);
  else a.append(el('span', 'd'));
  a.append(el('span', 'src mono', s.outlet.toUpperCase() + (s.outlet_count > 1 ? ` +${s.outlet_count - 1}` : '')));
  a.append(el('span', null, s.title));
  if (s.is_new) a.append(el('span', 'new mono', 'NEW'));
  return a;
}

/* Each lane drifts left on its own. Hover pauses it; drag it or scroll/swipe
   (mouse wheel or two-finger trackpad) to move it yourself. A quick flick coasts. */
const DRIFT = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 18; // px per second
let riverLanes = [];
let SCALE = 1;

function wrapOffset(L) {
  if (L.half > 0) L.offset = ((L.offset % L.half) + L.half) % L.half;
}

function setupLane(wrap, lane) {
  const L = { wrap, lane, offset: 0, half: 0, hover: false, press: null, drag: false, vel: 0, moved: 0 };
  wrap.addEventListener('pointerenter', () => { L.hover = true; });
  wrap.addEventListener('pointerleave', () => { L.hover = false; });
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    L.offset += d / SCALE; L.vel = 0; wrapOffset(L);
  }, { passive: false });
  // Press doesn't grab anything yet, so a plain click still opens the story.
  // Only once the pointer has moved a few pixels does it become a drag.
  wrap.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    L.press = { x: e.clientX, t: performance.now(), id: e.pointerId }; L.moved = 0; L.vel = 0;
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!L.press) return;
    const dx = (e.clientX - L.press.x) / SCALE;
    const now = performance.now();
    L.moved += Math.abs(dx);
    if (!L.drag && L.moved > 6) {
      L.drag = true;
      wrap.classList.add('dragging');
      try { wrap.setPointerCapture(L.press.id); } catch (err) {}
    }
    if (L.drag) {
      L.offset -= dx;
      L.vel = -dx / Math.max((now - L.press.t) / 1000, 0.008);
      wrapOffset(L);
    }
    L.press.x = e.clientX; L.press.t = now;
  });
  const end = () => { L.press = null; if (L.drag) { L.drag = false; wrap.classList.remove('dragging'); } };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
  // After a real drag, swallow the click so letting go doesn't open a story.
  wrap.addEventListener('click', (e) => { if (L.moved > 6) { e.preventDefault(); e.stopPropagation(); } }, true);
  return L;
}

let lastFrame = performance.now();
function animate(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  for (const L of riverLanes) {
    if (!L.drag) {
      if (Math.abs(L.vel) > 5) { L.offset += L.vel * dt; L.vel *= Math.exp(-dt * 3); }   // coast after a flick
      else if (!L.hover) { L.vel = 0; L.offset += DRIFT * dt; }
      wrapOffset(L);
    }
    L.lane.style.transform = `translateX(${-L.offset}px)`;
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function renderRiver(stories, devId) {
  const river = $('river');
  river.textContent = '';
  riverLanes = [];
  const lanes = [[], [], []];
  stories.forEach((s, i) => lanes[i % 3].push(s));
  lanes.forEach((list) => {
    const wrap = el('div', 'lane-wrap');
    const lane = el('div', 'lane');
    if (!list.length) { river.append(wrap); return; }
    // Repeat the list until it is wider than the screen, then double it for a seamless loop.
    let seq = list.slice();
    while (seq.length < 6) seq = seq.concat(list);
    seq.concat(seq).forEach((s) => lane.append(chip(s, devId)));
    wrap.append(lane);
    river.append(wrap);
    const L = setupLane(wrap, lane);
    riverLanes.push(L);
    requestAnimationFrame(() => { L.half = lane.scrollWidth / 2; L.offset = Math.random() * L.half * 0.3; });
  });
}

/* ---------- today's City meetings ---------- */
function renderMeetings(m) {
  const box = $('meetings');
  box.textContent = '';
  const list = (m && m.ok && m.meetings) || [];
  box.hidden = !list.length;
  if (!list.length) return;
  const dayLabel = m.is_today ? 'TODAY AT CITY HALL'
    : 'NEXT AT CITY HALL · ' + new Date(m.day + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
  box.append(el('span', 'hd', dayLabel));
  for (const r of list.slice(0, 4)) {
    const item = el('span');
    item.append(document.createTextNode(`${r.time} `));
    const link = r.agenda || r.url;
    if (link) { const a = el('a', null, r.body); a.href = link; a.target = '_blank'; a.rel = 'noopener'; item.append(a); }
    else item.append(document.createTextNode(r.body));
    box.append(item);
  }
}

/* ---------- breaking-news alert: pulses until you click it ---------- */
let currentDev = null;
function acked(id) { try { return id && localStorage.getItem('ackDev') === id; } catch (e) { return false; } }
function applyAlert() {
  const on = !!currentDev && !acked(currentDev.id);
  document.body.classList.toggle('is-dev', on);
  const color = currentDev ? '#E2603C' : '#E3A21A';
  $('clockFace').setAttribute('fill', color);
  $('clockHalo').setAttribute('fill', color);
  $('clockFace').classList.toggle('pulse', on);
  const tag = $('tag');
  tag.querySelector('.dot').classList.toggle('pulse', on);
  tag.classList.toggle('can-ack', on);
  tag.title = on ? 'Click to mark as seen (stops the pulsing)' : '';
  if (currentDev && $('lead').dataset.id === currentDev.id) {
    tag.querySelector('.label').textContent = on ? 'DEVELOPING' : 'DEVELOPING · SEEN';
  }
}
$('tag').addEventListener('click', () => {
  if (!currentDev || acked(currentDev.id)) return;
  try { localStorage.setItem('ackDev', currentDev.id); } catch (e) {}
  applyAlert();
});

/* ---------- ?debug=1: why each story scored the way it did ---------- */
function renderDebug(data, leadId) {
  if (!params.get('debug')) return;
  let box = $('debug');
  if (!box) { box = el('div'); box.id = 'debug'; document.body.append(box); }
  box.textContent = '';
  const line = (cls, text) => box.append(el('div', cls, text));
  box.append(el('h3', null, 'Why this screen looks the way it does'));
  line('k', `updated ${clock(data.generated_at)} · mode: ${mode} · lead: ${leadId || '—'}`);
  const w = (data.lead && data.lead.why) || {};
  line('k', `City pick: ${w.city || '—'} · Biggest pick: ${w.general || '—'}`);
  line('k', `breaking-news alert: ${data.developing || 'none'}`);
  box.append(el('h3', null, 'Sources'));
  for (const s of data.sources_status || []) {
    line(s.ok ? '' : 'bad', `${s.ok ? '✓' : '✗'} ${s.source} — ${s.items} items` +
      (s.junk_dropped ? `, ${s.junk_dropped} dropped as junk` : '') + (s.used_fallback ? ' (via Google News backup)' : '') +
      (s.ok ? '' : ` · ${(s.errors || [s.error]).join('; ')}`));
  }
  const junk = (data.sources_status || []).flatMap((s) => (s.junk_examples || []).map((t) => `${s.source}: ${t}`));
  if (junk.length) {
    box.append(el('h3', null, 'Dropped as junk (examples)'));
    for (const j of junk) line('k', '✗ ' + j);
  }
  box.append(el('h3', null, `Stories (${(data.stories || []).length}), biggest first`));
  for (const s of data.stories || []) {
    const d = el('div', 'story' + (s.id === leadId ? ' lead' : ''));
    d.append(el('div', 't', s.title));
    const y = s.why || {};
    d.append(el('div', 'k', `overall ${s.score} · City ${s.city_rank} (relevance ${s.city_score}${s.is_city ? ', counts' : ', below 3'}) · ` +
      `${s.outlet_count} outlet(s): ${s.outlets.join(', ')}`));
    d.append(el('div', 'k', `place: ${y.place}${y.place_evidence ? ` (“${y.place_evidence}”)` : ''} · local: ${y.local} · ` +
      `first seen ${ago(s.first_seen)}${y.remembered ? ' (remembered)' : ''}${y.downweighted ? ' · downweighted' : ''}`));
    for (const m of y.matches || []) {
      d.append(el('div', m.note ? 'bad' : '', m.note ? `✗ ${m.note} (${m.outlet})`
        : `+${m.points} ${m.group}: “${m.term}” in ${m.where} (${m.outlet})` + (m.incident ? ` — reduced: incident report (“${m.incident}”)` : '')));
    }
    if (s.developing) d.append(el('div', 'bad', `breaking: ${y.newsrooms_for_alert.length} newsrooms` + (y.breaking_word ? `, word “${y.breaking_word}”` : '')));
    if ((y.versions || []).length > 1) d.append(el('div', 'k', 'grouped: ' + y.versions.map((v) => `${v[0]}: ${v[1]}`).join(' / ')));
    box.append(d);
  }
}

/* ---------- whole screen ---------- */
function render(data) {
  renderWeather(data.weather);
  const stories = data.stories || [];
  $('empty').style.display = stories.length ? 'none' : 'block';
  $('lead').style.display = stories.length ? 'flex' : 'none';

  lastData = data;
  const byId = (id) => (id ? stories.find((s) => s.id === id) : null);
  const devStory = byId(data.developing);
  // A developing story always leads. Otherwise the switch decides.
  const cityPick = byId(data.lead && data.lead.city) || stories.find((s) => s.is_city);
  const generalPick = byId(data.lead && data.lead.general) || stories[0];
  const noCityNews = mode === 'city' && !cityPick;
  const lead = devStory || (mode === 'city' ? cityPick || generalPick : generalPick);
  currentDev = devStory;
  renderMeetings(data.meetings);
  renderDebug(data, lead && lead.id);

  const c = data.counts || {};
  const counts = $('counts');
  counts.textContent = `${c.stories ?? stories.length} stories · `;
  counts.insertAdjacentHTML('beforeend', HALL_ICON);
  counts.append(document.createTextNode(`${c.city ?? 0} for City Hall`));
  const age = (Date.now() - new Date(data.generated_at)) / 60000;
  const upd = $('updated');
  const when = new Date(data.generated_at);
  const sameDay = when.toDateString() === new Date().toDateString();
  upd.textContent = age > 60
    ? `● last update ${sameDay ? '' : when.toLocaleDateString('en-US', { weekday: 'short' }) + ' '}${clock(data.generated_at)}`
    : '';
  upd.className = age > 60 ? 'stale' : '';

  // Only rebuild the moving parts when the news actually changed (keeps the river smooth).
  const key = stories.map((s) => s.id + s.outlet_count).join('|') + data.developing + mode + (lead && lead.id);
  if (key === lastKey) { applyAlert(); return; }
  const first = !lastKey;
  lastKey = key;
  if (!lead) return;
  const swap = () => {
    renderLead(lead, !!devStory, noCityNews);
    $('lead').dataset.id = lead.id;
    applyAlert();
    renderRiver(stories.filter((s) => s !== lead), devStory && devStory.id);
    $('lead').classList.remove('fading');
  };
  if (first) swap();
  else { $('lead').classList.add('fading'); setTimeout(swap, 1200); }
}

// Sample files were captured once; slide their timestamps up to "now" so the ages read naturally.
function shiftSampleTimes(data) {
  const offset = Date.now() - new Date(data.generated_at).getTime();
  const shift = (iso) => new Date(new Date(iso).getTime() + offset).toISOString();
  data.generated_at = shift(data.generated_at);
  for (const s of data.stories || []) { s.first_seen = shift(s.first_seen); s.updated = shift(s.updated); }
}

let siteVersion = null;

async function load() {
  try {
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    // New page design published? Reload once to pick it up (the open tab otherwise keeps the old code).
    if (data.site_version && data.site_version !== 'local') {
      if (siteVersion && data.site_version !== siteVersion) { location.reload(); return; }
      siteVersion = data.site_version;
    }
    if (params.get('sample')) shiftSampleTimes(data);
    render(data);
  } catch (e) {
    console.warn('news.json not available yet', e);
    if (!lastKey) $('empty').style.display = 'block';
  }
}

/* Keep the laptop screen awake while this page is showing (Chrome / Edge). */
async function stayAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); }
  catch (e) { /* not supported or not allowed: no problem */ }
}

document.querySelectorAll('#mode button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
setMode(mode);
addEventListener('resize', fit);
document.addEventListener('visibilitychange', stayAwake);
fit(); tickClock(); load(); stayAwake();
setInterval(tickClock, 15000);
setInterval(load, REFRESH_MS);
</script>
