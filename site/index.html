<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cincy News Glance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* ---------- palette: change these to restyle everything ---------- */
  :root {
    --sky: #DCEBF3;
    --ink: #13283A;
    --muted: #3E5668;
    --river: #A9CADB;
    --city: #E3A21A;        /* City Hall marigold */
    --city-text: #8A5A00;
    --dev: #E2603C;         /* developing-story coral */
    --dev-text: #B13D1C;
    --chip: rgba(255, 255, 255, 0.82);
  }

  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Sky on top, river below, so any spare screen edges match the scene. */
  body { background: linear-gradient(var(--sky) 0 75%, var(--river) 75% 100%); cursor: default; }

  /* The whole scene is drawn at 1200x800 (a 3:2 laptop screen) and scaled to fit. */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1200px; height: 800px; overflow: hidden;
    transform-origin: center; background: var(--sky); color: var(--ink);
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  }
  .mono { font-family: 'DM Mono', ui-monospace, monospace; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scene #crown { pointer-events: all; }

  /* ---------- top bar ---------- */
  #bar {
    position: absolute; top: 30px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: flex-start; white-space: nowrap;
    font-size: 13px; letter-spacing: 0.06em; color: var(--muted);
  }
  #bar .left { display: flex; align-items: center; gap: 12px; min-height: 34px; }
  #bar .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; max-width: 330px; }
  #bar .sub { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11px; letter-spacing: 0.05em; }
  #bar .city { color: var(--ink); letter-spacing: 0.18em; }
  #wx { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  #wx svg { width: 20px; height: 20px; }
  .pill { padding: 4px 10px; border-radius: 999px; border: 1px solid #9DB2C0; font-size: 12px; letter-spacing: 0.03em; white-space: nowrap; }
  .pill.notable { border-color: var(--city); background: rgba(227,162,26,0.14); color: var(--city-text); }
  .pill.alert { border-color: var(--dev); background: rgba(226,96,60,0.12); color: var(--dev-text); }
  .stale { color: var(--dev-text); }

  /* City Hall / Biggest switch */
  .toggle { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: rgba(255,255,255,0.45); border: 1px solid #A6B9C6; }
  .toggle button { font: inherit; font-size: 12px; letter-spacing: 0.06em; color: var(--muted); background: transparent;
    border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .toggle button:hover { color: var(--ink); }
  .toggle button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(19,40,58,0.15); }
  .toggle button:focus-visible { outline: 2px solid var(--city); outline-offset: 1px; }

  /* ---------- lead story ---------- */
  #lead { position: absolute; top: 120px; left: 64px; width: min(660px, 46%); display: flex; flex-direction: column; gap: 14px; transition: opacity 1.2s ease; }
  #lead.fading { opacity: 0; }
  #lead.quick { transition: opacity 0.3s ease; }
  /* ‹ 1 / 3 › — flip through the top three stories */
  #tagrow { display: flex; align-items: center; gap: 14px; width: max-content; white-space: nowrap; }
  #pager { flex: none; }
  #pager { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; opacity: 0.75; transition: opacity 0.3s ease; }
  #lead:hover #pager { opacity: 1; }
  #pager[hidden] { display: none; }
  #pager button { font: inherit; font-size: 15px; line-height: 1; width: 22px; height: 22px; border-radius: 50%; border: 0; padding: 0;
    background: transparent; color: var(--muted); cursor: pointer; }
  #pager button:hover { background: rgba(255,255,255,0.7); color: var(--ink); }
  #pager button:focus-visible { outline: 2px solid var(--city); outline-offset: 1px; }
  #tag { display: flex; align-items: center; gap: 10px; white-space: nowrap; width: max-content; font-size: 13px; letter-spacing: 0.12em;
    font-family: 'DM Mono', ui-monospace, monospace; background: none; border: 0; padding: 0; margin: 0; color: inherit; text-align: left; cursor: default; }
  #tag.can-ack { cursor: pointer; }
  #tag.can-ack:hover .label { text-decoration: underline; text-underline-offset: 4px; }
  #tag .meta { color: var(--muted); letter-spacing: 0.03em; }
  #tag .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #headline { margin: 0; font-size: 42px; line-height: 1.08; font-weight: 600; letter-spacing: -0.01em;
    font-variation-settings: 'opsz' 96; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #headline a { color: inherit; text-decoration: none; }
  #headline a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
  #dek { margin: 0; font-size: 18px; line-height: 1.42; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #coverage { display: flex; gap: 6px; flex-wrap: wrap; }
  #coverage span { font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid #A6B9C6; color: #4B6274; }
  #coverage span.on, #coverage a.on { background: rgba(255,255,255,0.85); border-color: #7D93A3; color: var(--ink); }
  #coverage a { font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid #A6B9C6; text-decoration: none; }
  #coverage a.on:hover { background: #fff; border-color: #13283A; }

  /* ---------- river of headlines ---------- */
  #river { position: absolute; left: 0; right: 0; top: 614px; display: flex; flex-direction: column; gap: 20px; }
  .lane-wrap { overflow: hidden; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .lane-wrap.dragging { cursor: grabbing; }
  .lane-wrap:nth-child(2) { padding-left: 170px; }
  .lane-wrap:nth-child(3) { padding-left: 60px; }
  .lane { display: flex; gap: 22px; width: max-content; will-change: transform; }
  .chip { -webkit-user-drag: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px;
    border-radius: 999px; background: var(--chip); border: 1px solid rgba(19,40,58,0.10);
    color: var(--ink); text-decoration: none; font-size: 15px; white-space: nowrap; }
  .chip:hover { background: #fff; }
  .chip .d { width: 8px; height: 8px; border-radius: 50%; background: #6F9BB3; flex: none; }
  /* City Hall stories: a tiny City Hall in place of the dot, plus a faint warm tint */
  .chip.city { background: rgba(255, 246, 222, 0.94); border-color: rgba(201, 142, 22, 0.55); }
  .chip.city:hover { background: #FFF6DE; }
  .hall { width: 15px; height: 15px; flex: none; display: block; }
  #counts .hall { width: 13px; height: 13px; display: inline-block; vertical-align: -2px; margin: 0 5px 0 1px; }
  .chip.dev { border-color: rgba(226,96,60,0.55); }
  .chip.dev .d { background: var(--dev); }
  .chip .src { font-size: 11px; letter-spacing: 0.06em; color: #4B6274; }
  .chip .new { font-size: 10px; letter-spacing: 0.1em; color: var(--city-text); border: 1px solid var(--city); border-radius: 999px; padding: 1px 6px; }

  #empty { position: absolute; top: 160px; left: 64px; font-size: 22px; color: var(--muted); display: none; }

  /* ---------- motion ---------- */
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(1.8); } }
  @keyframes cloud { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-40px); } }
  @keyframes shimmer { 0%,100% { transform: translateX(0); opacity: .45; } 50% { transform: translateX(-20px); opacity: .9; } }
  .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .cloud { animation: cloud 90s ease-in-out infinite; }
  .sh { animation: shimmer 11s ease-in-out infinite; }
  #glow { opacity: 0; transition: opacity 3s ease; }

  /* ---------- time of day: dusk after 5 PM, evening after 7:30 PM ---------- */
  #veil { opacity: 0; pointer-events: none; transition: opacity 90s ease, fill 90s ease; }
  .phase-dusk #veil { opacity: 0.07; fill: #E8A27C; }
  .phase-evening #veil { opacity: 0.16; fill: #1F2B48; }
  #sun { transition: opacity 6s ease, transform 90s ease; transform-box: view-box; }
  .phase-dusk #sun circle { fill: #FFD8B4; transition: fill 90s ease; }
  .phase-evening #sun { opacity: 0 !important; }
  #moon { opacity: 0; transition: opacity 60s ease; }
  .phase-evening #moon { opacity: 0.9; }
  .phase-evening { --muted: #22364A; }

  /* ---------- outlet feed trouble: dashed label with a coral dot ---------- */
  #coverage .down { border-style: dashed; border-color: var(--dev); }
  #coverage .down::after { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--dev); margin-left: 6px; vertical-align: 1px; }
  #reminder { color: var(--dev-text); }
  #games > span { cursor: default; }
  #games { color: var(--ink); display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  #games .live { color: var(--dev-text); }
  /* home = solid dot, away = hollow ring, in the team's color */
  #games .ha { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; box-sizing: border-box; }

  /* ---------- stadium lights on home game days ---------- */
  .stadium .lamp { fill: #A9B9C4; transition: fill 4s ease; }
  .stadium .halo { fill: #FFE2A0; opacity: 0; transition: opacity 6s ease; }
  .stadium.lit .lamp { fill: #FFE7A8; }
  .stadium.lit .halo { opacity: 0.18; }
  .phase-dusk .stadium.lit .halo { opacity: 0.35; }
  .phase-evening .stadium.lit .halo { opacity: 0.6; }
  #crown { cursor: default; }
  /* played in the last 3 days: stadium glows in the team's colors; hover shows the result */
  .stadium .rim { fill: none; stroke: none; }
  .stadium .bulbs { opacity: 0; transition: opacity 6s ease; }
  .stadium.recent .bulbs { opacity: 1; }
  .stadium.recent:not(.lit) .lamp { opacity: 0; }
  .bulbs .b { fill: var(--c1, #FFE2A0); animation: twinkle var(--tw, 7s) ease-in-out infinite; animation-delay: var(--td, 0s); }
  .bulbs .b.alt { fill: var(--c2, #FFFFFF); }
  .bulbs .h { fill: var(--c1, #FFE2A0); opacity: 0.18; }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  .stadium .hit { fill: #000; fill-opacity: 0; }
  #scene .stadium.recent .hit { pointer-events: all; cursor: default; }
  #tip { position: absolute; z-index: 5; pointer-events: none; display: none; padding: 6px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.96); box-shadow: 0 2px 10px rgba(19,40,58,0.18); font: 12px/1.35 'DM Mono', ui-monospace, monospace;
    color: var(--ink); white-space: nowrap; }
  #tip .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  /* ---------- river: older headlines quietly fade ---------- */
  .chip.aging { color: #2B4153; }
  .chip.old { color: #4B6274; background: rgba(255, 255, 255, 0.66); }
  .chip.city.old { background: rgba(255, 246, 222, 0.72); }

  /* ---------- weather in the scene: slow, faint, never the main event ---------- */
  #stage, body { transition: background 6s ease; }
  #sun { transition: opacity 6s ease; }
  #rays { opacity: 0; transform-box: view-box; transform-origin: 1070px 128px; animation: spin 200s linear infinite; transition: opacity 6s ease; }
  #sunGlow { transform-box: fill-box; transform-origin: center; animation: breathe 9s ease-in-out infinite; }
  #moreClouds, #fog, #ripples, #precip { opacity: 0; transition: opacity 6s ease; }
  #moreClouds .cl { fill: #FFFFFF; opacity: 0.75; transition: fill 6s ease; }
  #flash { opacity: 0; pointer-events: none; }
  .wx-sunny #rays { opacity: 0.55; }
  .wx-partly #moreClouds { opacity: 0.55; }
  .wx-cloudy #sun { opacity: 0.3; }
  .wx-cloudy #moreClouds, .wx-rain #moreClouds, .wx-storm #moreClouds, .wx-snow #moreClouds { opacity: 1; }
  .wx-rain #moreClouds .cl, .wx-storm #moreClouds .cl { fill: #E4EAEE; }
  .wx-rain #sun, .wx-storm #sun, .wx-snow #sun, .wx-fog #sun { opacity: 0.12; }
  .wx-rain #precip, .wx-storm #precip, .wx-snow #precip { opacity: 1; }
  .wx-rain #ripples, .wx-storm #ripples { opacity: 1; }
  .wx-fog #fog { opacity: 1; }
  .wx-storm #flash { animation: flash 41s linear infinite; }
  .fogband { animation: cloud 80s ease-in-out infinite; }
  .drop { animation: rainfall var(--d, 1.8s) linear infinite; animation-delay: var(--delay, 0s); }
  .flake { animation: snowfall var(--d, 18s) linear infinite; animation-delay: var(--delay, 0s); }
  .ripple { transform-box: fill-box; transform-origin: center; animation: ripple var(--d, 4s) ease-out infinite; animation-delay: var(--delay, 0s); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes rainfall { from { transform: translate(0, -60px); } to { transform: translate(-80px, 640px); } }
  @keyframes snowfall { 0% { transform: translate(0, -30px); } 50% { transform: translate(22px, 300px); } 100% { transform: translate(-8px, 640px); } }
  @keyframes ripple { 0% { transform: scale(0.2); opacity: 0.55; } 70%,100% { transform: scale(1.6); opacity: 0; } }
  @keyframes flash { 0%,95.6% { opacity: 0; } 96% { opacity: 0.22; } 96.5% { opacity: 0; } 97% { opacity: 0.14; } 97.6%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #precip, #ripples, #flash { display: none; } #rays, #sunGlow, .fogband { animation: none; } }
  .is-dev #glow { opacity: 0.22; }
  @media (prefers-reduced-motion: reduce) { .pulse, .cloud, .sh { animation: none; } }

  /* today's City meetings, under the lead story */
  #meetings { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; font-size: 12px; color: var(--muted); letter-spacing: 0.03em; }
  #meetings .hd { color: var(--city-text); letter-spacing: 0.12em; }
  #meetings a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted #7D93A3; }
  #meetings a:hover { border-bottom-style: solid; }
  .wx-asof { color: var(--muted); font-size: 11px; }

  /* ?debug=1 — why each story scored the way it did */
  #debug { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw); overflow: auto; z-index: 10;
    background: rgba(255,255,255,0.97); color: #13283A; font: 11px/1.45 'DM Mono', ui-monospace, monospace;
    border-left: 1px solid #A6B9C6; padding: 14px 16px 40px; box-sizing: border-box; }
  #debug h3 { font: 600 13px 'Bricolage Grotesque', sans-serif; margin: 16px 0 6px; }
  #debug .story { border-top: 1px solid #DCE5EB; padding: 8px 0; }
  #debug .t { font: 500 13px/1.3 'Bricolage Grotesque', sans-serif; }
  #debug .lead { background: #FFF6DF; }
  #debug .bad { color: #B13D1C; }
  #debug .k { color: #4B6274; }
  #debug button { font: inherit; }
  #debug .acts { display: flex; gap: 8px; margin-top: 4px; }
  #debug .acts a { font-size: 11px; padding: 2px 8px; border: 1px solid #A6B9C6; border-radius: 999px; color: #13283A; text-decoration: none; }
  #debug .acts a:hover { background: #EEF3F6; }
</style>
</head>
<body>
<div id="stage">

  <svg id="scene" viewBox="0 0 1200 800" aria-hidden="true">
    <defs>
      <linearGradient id="glowFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F08A62" stop-opacity="0"></stop>
        <stop offset="1" stop-color="#F08A62" stop-opacity="1"></stop>
      </linearGradient>
    </defs>
    <rect x="-1200" y="260" width="3600" height="340" fill="url(#glowFade)" id="glow"></rect>
    <!-- sun + clouds -->
    <rect id="flash" x="-1200" y="0" width="3600" height="600" fill="#FFFFFF"></rect>
    <defs>
      <mask id="crescent"><rect x="1000" y="60" width="140" height="100" fill="#FFFFFF"></rect><circle cx="1079" cy="104" r="15" fill="#000000"></circle></mask>
    </defs>
    <g id="moon"><circle cx="1070" cy="110" r="16" fill="#F4F1E4" mask="url(#crescent)"></circle></g>
    <g id="sun">
      <g id="rays" stroke="#FFE7A0" stroke-width="2" stroke-linecap="round">
        <line x1="1070" y1="58" x2="1070" y2="44"></line><line x1="1070" y1="198" x2="1070" y2="212"></line>
        <line x1="1000" y1="128" x2="986" y2="128"></line><line x1="1140" y1="128" x2="1154" y2="128"></line>
        <line x1="1020.5" y1="78.5" x2="1010.6" y2="68.6"></line><line x1="1119.5" y1="177.5" x2="1129.4" y2="187.4"></line>
        <line x1="1020.5" y1="177.5" x2="1010.6" y2="187.4"></line><line x1="1119.5" y1="78.5" x2="1129.4" y2="68.6"></line>
      </g>
      <circle id="sunGlow" cx="1070" cy="128" r="58" fill="#FFF3CF" opacity="0.6"></circle>
      <circle cx="1070" cy="128" r="36" fill="#FFF3CF"></circle>
    </g>
    <g class="cloud" fill="#FFFFFF" opacity="0.85">
      <rect x="760" y="96" width="150" height="16" rx="8"></rect>
      <rect x="800" y="80" width="80" height="20" rx="10"></rect>
    </g>
    <g class="cloud" fill="#FFFFFF" opacity="0.7" style="animation-delay:-40s">
      <rect x="930" y="232" width="120" height="14" rx="7"></rect>
      <rect x="958" y="218" width="58" height="18" rx="9"></rect>
    </g>

    <!-- extra clouds for cloudy / rainy / snowy days -->
    <g id="moreClouds">
      <g class="cloud" style="animation-duration:120s;animation-delay:-20s">
        <rect class="cl" x="80" y="150" width="200" height="22" rx="11"></rect>
        <rect class="cl" x="130" y="130" width="100" height="26" rx="13"></rect>
      </g>
      <g class="cloud" style="animation-duration:140s;animation-delay:-70s">
        <rect class="cl" x="420" y="70" width="230" height="22" rx="11"></rect>
        <rect class="cl" x="480" y="50" width="120" height="26" rx="13"></rect>
      </g>
      <g class="cloud" style="animation-duration:110s;animation-delay:-50s">
        <rect class="cl" x="980" y="60" width="200" height="22" rx="11"></rect>
        <rect class="cl" x="1030" y="40" width="96" height="26" rx="13"></rect>
      </g>
      <g class="cloud" style="animation-duration:160s;animation-delay:-10s">
        <rect class="cl" x="640" y="250" width="170" height="18" rx="9"></rect>
      </g>
    </g>
    <!-- rain or snow, falling behind the hills -->
    <g id="precip"></g>

    <!-- hills: Price Hill bluff (west), the basin, Mount Adams (east) -->
    <!-- hills beyond the original 1200px frame, for wide screens -->
    <path d="M-1200 444 C -1000 424 -820 430 -640 438 S -300 416 -150 424 S -40 432 0 430 L0 600 L-1200 600 Z" fill="#C8DAE1"></path>
    <path d="M1200 418 C 1330 412 1460 430 1600 426 S 1900 410 2050 420 S 2300 432 2400 428 L2400 600 L1200 600 Z" fill="#C8DAE1"></path>
    <path d="M-1200 468 C -1020 446 -860 452 -700 460 S -380 440 -220 446 S -60 456 0 452 L0 600 L-1200 600 Z" fill="#ADC7B3"></path>
    <path d="M1200 456 C 1320 450 1440 466 1560 462 S 1820 446 1960 452 S 2260 466 2400 460 L2400 600 L1200 600 Z" fill="#ADC7B3"></path>
    <g fill="#9EBDA6">
      <circle cx="-560" cy="450" r="8"></circle><circle cx="-480" cy="446" r="9"></circle><circle cx="-300" cy="440" r="8"></circle>
      <circle cx="-120" cy="446" r="7"></circle><circle cx="1290" cy="456" r="8"></circle><circle cx="1420" cy="462" r="7"></circle>
      <circle cx="1700" cy="456" r="9"></circle><circle cx="1880" cy="450" r="8"></circle>
    </g>
    <path d="M-1200 562 C -900 552 -500 550 -200 556 S -40 562 0 560 L0 600 L-1200 600 Z" fill="#9CBBA4"></path>
    <path d="M1200 590 L2400 590 L2400 600 L1200 600 Z" fill="#9CBBA4"></path>

    <path d="M0 430 C 90 410 170 408 260 418 C 360 430 420 452 520 458 C 640 466 780 462 900 456 C 980 452 1020 420 1090 414 C 1140 410 1180 414 1200 418 L1200 600 L0 600 Z" fill="#C8DAE1"></path>
    <path d="M0 452 C 70 436 170 430 260 440 C 310 446 340 470 380 506 C 410 532 450 544 520 546 C 640 550 820 548 920 540 C 960 530 985 490 1020 470 C 1060 452 1120 450 1200 456 L1200 600 L0 600 Z" fill="#ADC7B3"></path>
    <g fill="#9EBDA6">
      <circle cx="40" cy="452" r="9"></circle><circle cx="96" cy="444" r="8"></circle><circle cx="150" cy="440" r="9"></circle>
      <circle cx="206" cy="442" r="8"></circle><circle cx="262" cy="448" r="7"></circle><circle cx="318" cy="470" r="7"></circle>
      <circle cx="1040" cy="468" r="7"></circle><circle cx="1100" cy="458" r="8"></circle><circle cx="1156" cy="458" r="8"></circle>
    </g>
    <path d="M0 560 C 120 548 240 552 340 566 C 380 574 420 584 460 590 L1200 590 L1200 600 L0 600 Z" fill="#9CBBA4"></path>

    <!-- fog drifting over the hills -->
    <g id="fog" fill="#FFFFFF">

<script>
/* ------------------------------------------------------------------
   The page reloads news.json every 5 minutes. A scheduled GitHub job
   rewrites that file every 15 minutes during work hours.
   Preview without live data:  index.html?sample=calm  or  ?sample=dev
------------------------------------------------------------------- */
const CORE_OUTLETS = ['Enquirer', 'WCPO', 'WLWT', 'FOX19', 'Local 12', 'WVXU', 'Signal'];
const REFRESH_MS = 5 * 60 * 1000;
const params = new URLSearchParams(location.search);
const DATA_URL = params.get('sample') ? `sample-${params.get('sample')}.json` : 'news.json';

const $ = (id) => document.getElementById(id);
let lastKey = '';
let lastData = null;

// Which story leads: 'city' (default) or 'general'. Remembered in this browser.
let mode = 'city';
try { mode = localStorage.getItem('leadMode') === 'general' ? 'general' : 'city'; } catch (e) {}

function setMode(next) {
  mode = next;
  try { localStorage.setItem('leadMode', mode); } catch (e) {}
  document.querySelectorAll('#mode button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  if (lastData) render(lastData);
}

// Feed text is untrusted, so it is always inserted as text, never as HTML.
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* The scene is 800 units tall. On a screen wider than 3:2 the stage grows sideways to fill it
   (skyline stays centered; hills, river and sky continue to the edges). On a narrower screen it
   shrinks to fit the width instead. */
let VB = { x: 0, w: 1200 };
function fit() {
  let s = innerHeight / 800;
  let W = innerWidth / s;
  if (W < 1200) { s = innerWidth / 1200; W = 1200; }
  W = Math.min(W, 3400);
  SCALE = s;
  const stage = $('stage');
  stage.style.width = `${W}px`;
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  const pad = (W - 1200) / 2;
  VB = { x: -pad, w: W };
  $('scene').setAttribute('viewBox', `${-pad} 0 ${W} 800`);
  if (sceneKind) { const k = sceneKind; sceneKind = null; setScene(k); }   // re-spread rain/snow across the new width
}

function tickClock() {
  const now = new Date();
  if (typeof applySky === 'function' && sceneKind) applySky();
  $('date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  $('time').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function clock(iso) {
  return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return `${h} hr${h > 1 ? 's' : ''} ago`;
}

/* ---------- weather icon (simple line drawings) ---------- */
function weatherIcon(short) {
  const s = (short || '').toLowerCase();
  const stroke = 'fill="none" stroke="#13283A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
  const sun = `<circle cx="10" cy="10" r="4" ${stroke}/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" ${stroke}/>`;
  const cloud = `<path d="M6 15h8.5a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6 1.4A2.8 2.8 0 0 0 6 15z" ${stroke}/>`;
  let body = sun;
  if (/thunder/.test(s)) body = cloud + `<path d="M10 15l-1.5 3h3L10 21" ${stroke}/>`;
  else if (/snow|flurr|sleet/.test(s)) body = cloud + `<path d="M7 18h.01M10 19h.01M13 18h.01" ${stroke}/>`;
  else if (/rain|shower|drizzle/.test(s)) body = cloud + `<path d="M7 17l-1 2M10 17l-1 2M13 17l-1 2" ${stroke}/>`;
  else if (/fog|haze|mist/.test(s)) body = `<path d="M3 8h14M3 11h14M5 14h10" ${stroke}/>`;
  else if (/partly|mostly sunny|mostly clear/.test(s)) body = `<g transform="translate(-2,-2) scale(.8)">${sun}</g>` + cloud;
  else if (/cloud|overcast/.test(s)) body = cloud;
  return `<svg viewBox="0 0 20 22" aria-hidden="true">${body}</svg>`;
}

/* ---------- weather in the scene ---------- */
const SKY = { sunny: '#DCEBF3', partly: '#DAE7EF', cloudy: '#D4DEE5', rain: '#CBD6DE', storm: '#C3CED7', snow: '#E0E7EC', fog: '#DCE2E6' };
const SVGNS = 'http://www.w3.org/2000/svg';
let sceneKind = null;

function weatherKind(short) {
  const s = (short || '').toLowerCase();
  if (/thunder|t-storm|storm/.test(s)) return 'storm';
  if (/snow|flurr|sleet|ice|wintry|freezing/.test(s)) return 'snow';
  if (/rain|shower|drizzle/.test(s)) return 'rain';
  if (/fog|haze|mist|smoke/.test(s)) return 'fog';
  if (/partly|mostly sunny|mostly clear/.test(s)) return 'partly';
  if (/cloud|overcast/.test(s)) return 'cloudy';
  return 'sunny';
}

function svg(tag, attrs, cls) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (cls) n.setAttribute('class', cls);
  return n;
}

/* ---------- the real sun over Cincinnati ----------
   Standard solar-position formulas (the same math as the NOAA calculator), so the scene
   follows the actual daylight: dark by 5:30 in January, light past 8:30 in June. */
const LAT = 39.1031, LON = -84.5120;
const RAD = Math.PI / 180, DAY_MS = 86400000, J1970 = 2440588, J2000 = 2451545, TILT = RAD * 23.4397;
function solar(date) {
  const d = date / DAY_MS - 0.5 + J1970 - J2000;                                 // days since 2000
  const M = RAD * (357.5291 + 0.98560028 * d);                                   // sun's mean anomaly
  const L = M + RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + RAD * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(TILT) * Math.sin(L));                           // declination
  const ra = Math.atan2(Math.sin(L) * Math.cos(TILT), Math.cos(L));
  const lw = RAD * -LON, phi = RAD * LAT;
  const H = RAD * (280.16 + 360.9856235 * d) - lw - ra;                          // hour angle
  const elevation = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H)) / RAD;
  // today's sunrise / sunset
  const n = Math.round(d - 0.0009 - lw / (2 * Math.PI));
  const ds = 0.0009 + lw / (2 * Math.PI) + n;
  const Ms = RAD * (357.5291 + 0.98560028 * ds);
  const Ls = Ms + RAD * (1.9148 * Math.sin(Ms) + 0.02 * Math.sin(2 * Ms) + 0.0003 * Math.sin(3 * Ms)) + RAD * 102.9372 + Math.PI;
  const decS = Math.asin(Math.sin(TILT) * Math.sin(Ls));
  const noon = J2000 + ds + 0.0053 * Math.sin(Ms) - 0.0069 * Math.sin(2 * Ls);
  const w = Math.acos((Math.sin(RAD * -0.833) - Math.sin(phi) * Math.sin(decS)) / (Math.cos(phi) * Math.cos(decS)));
  const set = noon + w / (2 * Math.PI);
  const toDate = (j) => new Date((j + 0.5 - J1970) * DAY_MS);
  return { elevation, sunrise: toDate(noon - (set - noon)), sunset: toDate(set) };
}

/* Phases: "dawn" around sunrise, "day", "dusk" from an hour before sunset to half an hour after,
   then "evening" until 40 minutes before the next sunrise. (?phase=dusk etc. previews one.) */
function dayPhase(now = new Date()) {
  const forced = params.get('phase');
  if (forced) return forced;
  const { sunrise, sunset } = solar(now);
  const min = 60000;
  if (now < sunrise - 40 * min || now > sunset.getTime() + 35 * min) return 'evening';
  if (now <= sunrise.getTime() + 40 * min) return 'dawn';
  if (now >= sunset - 70 * min) return 'dusk';
  return 'day';
}
function blend(a, b, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
let currentPhase = null;
function applySky() {
  const phase = dayPhase();
  const look = phase === 'dawn' ? 'dusk' : phase;          // dawn borrows dusk's soft colors
  const base = SKY[sceneKind || 'sunny'];
  const sky = look === 'dusk' ? blend(base, '#F2D2C2', 0.35) : look === 'evening' ? blend(base, '#7C88A8', 0.4) : base;
  document.documentElement.style.setProperty('--sky', sky);
  if (look !== currentPhase) {
    document.body.classList.remove('phase-day', 'phase-dusk', 'phase-evening');
    document.body.classList.add('phase-' + look);
    currentPhase = look;
  }
  // The sun sits as high in the picture as it really is: high at a summer noon, low on a winter afternoon.
  const { elevation } = solar(new Date());
  const drop = look === 'dusk' ? 150 : Math.max(0, Math.min(1, (45 - elevation) / 40)) * 110;
  $('sun').style.transform = `translateY(${params.get('phase') ? (look === 'dusk' ? 150 : 0) : drop}px)`;
}

function setScene(kind) {
  if (kind === sceneKind) return;
  sceneKind = kind;
  document.body.classList.remove(...Object.keys(SKY).map((k) => 'wx-' + k));
  document.body.classList.add('wx-' + kind);
  applySky();

  const precip = $('precip'), ripples = $('ripples');
  precip.textContent = ''; ripples.textContent = '';
  const rand = (a, b) => a + Math.random() * (b - a);
  if (kind === 'rain' || kind === 'storm') {
    const n = Math.round((kind === 'storm' ? 90 : 60) * VB.w / 1200);
    for (let i = 0; i < n; i++) {
      const x = rand(VB.x - 20, VB.x + VB.w + 80), y = rand(-40, 20);
      const d = svg('line', { x1: x, y1: y, x2: x - 4, y2: y + 15, stroke: '#8EAABD', 'stroke-width': 1.2, 'stroke-linecap': 'round', opacity: rand(0.25, 0.5).toFixed(2) }, 'drop');
      d.style.setProperty('--d', `${rand(1.5, 2.3).toFixed(2)}s`);
      d.style.setProperty('--delay', `${-rand(0, 2.3).toFixed(2)}s`);
      precip.append(d);
    }
    for (let i = 0; i < 10; i++) {
      const r = svg('ellipse', { cx: rand(VB.x + 40, VB.x + VB.w - 40), cy: rand(612, 790), rx: 10, ry: 2.6 }, 'ripple');
      r.style.setProperty('--d', `${rand(3.5, 5.5).toFixed(2)}s`);
      r.style.setProperty('--delay', `${-rand(0, 5).toFixed(2)}s`);
      ripples.append(r);
    }
  } else if (kind === 'snow') {
    for (let i = 0; i < Math.round(70 * VB.w / 1200); i++) {
      const f = svg('circle', { cx: rand(VB.x, VB.x + VB.w), cy: rand(-30, 10), r: rand(1.2, 2.8).toFixed(1), fill: '#FFFFFF', opacity: rand(0.55, 0.9).toFixed(2) }, 'flake');
      f.style.setProperty('--d', `${rand(14, 26).toFixed(1)}s`);
      f.style.setProperty('--delay', `${-rand(0, 26).toFixed(1)}s`);
      precip.append(f);
    }
  }
}

function renderWeather(w) {
  const wx = $('wx'), ch = $('wxchange');
  wx.textContent = '';
  // ?weather=rain (or sunny, partly, cloudy, storm, snow, fog) previews a scene.
  setScene(params.get('weather') || (w && w.ok ? weatherKind(w.short) : 'sunny'));
  if (!w || !w.ok) { ch.hidden = true; return; }
  wx.insertAdjacentHTML('beforeend', weatherIcon(w.short)); // icon is our own markup, not feed text
  wx.append(el('span', null, `${w.temp}° ${w.short}`));
  if (w.stale && w.as_of) wx.append(el('span', 'wx-asof', `as of ${clock(w.as_of)}`));
  const c = w.change || {};
  ch.hidden = !c.text;
  ch.textContent = c.text || '';
  ch.className = 'pill ' + (c.level === 'alert' ? 'alert' : c.level === 'notable' ? 'notable' : '');
}

/* ---------- lead story ---------- */
// "CITY HALL · CITY MANAGER", "CITY HALL · POLICE", "CITY HALL · STATE LAW"...
function cityLabel(story) {
  const why = (story.city_reasons || [])[0];
  return why && why !== 'City Hall' ? `CITY HALL · ${why.toUpperCase()}` : 'CITY HALL';
}

function renderLead(story, isDev, noCityNews) {
  const label = isDev ? 'DEVELOPING'
    : story.is_city ? cityLabel(story)
    : mode === 'general' ? 'TOP STORY'
    : 'AROUND TOWN';
  const color = isDev ? 'var(--dev)' : story.is_city ? 'var(--city)' : '#6F9BB3';
  const textColor = isDev ? 'var(--dev-text)' : story.is_city ? 'var(--city-text)' : 'var(--muted)';
  const others = story.outlet_count - 1;
  const meta = isDev
    ? `· ${story.outlet_count} newsrooms · first report ${ago(story.first_seen)} · updated ${ago(story.updated)}`
    : `· ${story.outlet}${others > 0 ? ` and ${others} other${others > 1 ? 's' : ''}` : ''} · ${ago(story.first_seen)}` +
      (noCityNews ? ' · no City Hall news yet' : '');

  const tag = $('tag');
  tag.querySelector('.dot').style.background = color;
  tag.querySelector('.label').textContent = label;
  tag.querySelector('.label').style.color = textColor;
  tag.querySelector('.meta').textContent = meta;

  const a = $('headline').querySelector('a');
  a.textContent = story.title;
  a.href = story.link;

  // Google News summaries often just repeat the headline; hide those.
  const dek = story.summary && !story.summary.toLowerCase().startsWith(story.title.toLowerCase().slice(0, 30)) ? story.summary : '';
  $('dek').textContent = dek;
  $('dek').hidden = !dek;

  const cov = $('coverage');
  cov.textContent = '';
  const extras = story.outlets.filter((o) => !CORE_OUTLETS.includes(o));
  // Outlets that covered it link to their own version of the story.
  const links = story.links || {};
  // Outlet feeds that have failed 3+ updates in a row get a dashed label and a coral dot.
  const health = {};
  for (const st of (lastData && lastData.sources_status) || []) health[st.source] = st.fail_streak || 0;
  for (const o of CORE_OUTLETS.concat(extras)) {
    const down = (health[o] || 0) >= 3;
    let n;
    if (story.outlets.includes(o) && links[o]) {
      n = el('a', 'on', o);
      n.href = links[o]; n.target = '_blank'; n.rel = 'noopener';
      n.title = `Read ${o}'s version`;
    } else {
      n = el('span', story.outlets.includes(o) ? 'on' : '', o);
    }
    if (down) { n.classList.add('down'); n.title = `${o}'s feed hasn't worked for the last ${health[o]} updates`; }
    cov.append(n);
  }
}

/* ---------- river lanes ---------- */
// A little City Hall: building, roof, clock tower. Our own markup, never feed text.
const HALL_ICON = '<svg class="hall" viewBox="0 0 16 16" aria-hidden="true">' +
  '<path d="M1.5 14.5h13M2.6 14.5V9.6h10.8v4.9M2 9.6l1.6-1.5h8.8L14 9.6M9 8.1V4.2l1.3-2.4 1.3 2.4v3.9M5 14.5v-2.6M7 14.5v-2.6" ' +
  'fill="none" stroke="#8A5A00" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>' +
  '<circle cx="10.3" cy="5.6" r="0.95" fill="#E3A21A"/></svg>';

function chip(s, devId) {
  const a = el('a', 'chip ' + (s.id === devId ? 'dev' : s.is_city ? 'city' : 'town'));
  const ageH = (Date.now() - new Date(s.updated)) / 3600e3;
  if (s.id !== devId) a.classList.add(ageH > 8 ? 'old' : ageH > 3 ? 'aging' : 'fresh');
  a.href = s.link; a.target = '_blank'; a.rel = 'noopener'; a.draggable = false;
  a.title = `${s.title} — ${s.outlets.join(', ')}` + (s.is_city ? ` (${(s.city_reasons || []).join(', ')})` : '');
  if (s.is_city && s.id !== devId) a.insertAdjacentHTML('beforeend', HALL_ICON);
  else a.append(el('span', 'd'));
  a.append(el('span', 'src mono', s.outlet.toUpperCase() + (s.outlet_count > 1 ? ` +${s.outlet_count - 1}` : '')));
  a.append(el('span', null, s.title));
  if (s.is_new) a.append(el('span', 'new mono', 'NEW'));
  return a;
}

/* Each lane drifts left on its own. Hover pauses it; drag it or scroll/swipe
   (mouse wheel or two-finger trackpad) to move it yourself. A quick flick coasts. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let DRIFT = REDUCED ? 0 : 18;          // px per second; set by how busy the news is (see renderRiver)
let riverLanes = [];
let SCALE = 1;

function wrapOffset(L) {
  if (L.half > 0) L.offset = ((L.offset % L.half) + L.half) % L.half;
}

function setupLane(wrap, lane) {
  const L = { wrap, lane, offset: 0, half: 0, hover: false, press: null, drag: false, vel: 0, moved: 0 };
  wrap.addEventListener('pointerenter', () => { L.hover = true; });
  wrap.addEventListener('pointerleave', () => { L.hover = false; });
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    L.offset += d / SCALE; L.vel = 0; wrapOffset(L);
  }, { passive: false });
  // Press doesn't grab anything yet, so a plain click still opens the story.
  // Only once the pointer has moved a few pixels does it become a drag.
  wrap.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    L.press = { x: e.clientX, t: performance.now(), id: e.pointerId }; L.moved = 0; L.vel = 0;
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!L.press) return;
    const dx = (e.clientX - L.press.x) / SCALE;
    const now = performance.now();
    L.moved += Math.abs(dx);
    if (!L.drag && L.moved > 6) {
      L.drag = true;
      wrap.classList.add('dragging');
      try { wrap.setPointerCapture(L.press.id); } catch (err) {}
    }
    if (L.drag) {
      L.offset -= dx;
      L.vel = -dx / Math.max((now - L.press.t) / 1000, 0.008);
      wrapOffset(L);
    }
    L.press.x = e.clientX; L.press.t = now;
  });
  const end = () => { L.press = null; if (L.drag) { L.drag = false; wrap.classList.remove('dragging'); } };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
  // After a real drag, swallow the click so letting go doesn't open a story.
  wrap.addEventListener('click', (e) => { if (L.moved > 6) { e.preventDefault(); e.stopPropagation(); } }, true);
  return L;
}

let lastFrame = performance.now();
function animate(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  for (const L of riverLanes) {
    if (!L.drag) {
      if (Math.abs(L.vel) > 5) { L.offset += L.vel * dt; L.vel *= Math.exp(-dt * 3); }   // coast after a flick
      else if (!L.hover) { L.vel = 0; L.offset += DRIFT * dt; }
      wrapOffset(L);
    }
    L.lane.style.transform = `translateX(${-L.offset}px)`;
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function renderRiver(stories, devId) {
  // Quiet news day: slow drift. Busy day: a little quicker. (12–24 px/s)
  const recent = stories.filter((s) => Date.now() - new Date(s.updated) < 3 * 3600e3).length;
  DRIFT = REDUCED ? 0 : 12 + Math.min(recent, 15) * 0.8;
  const river = $('river');
  river.textContent = '';
  riverLanes = [];
  const lanes = [[], [], []];
  stories.forEach((s, i) => lanes[i % 3].push(s));
  lanes.forEach((list) => {
    const wrap = el('div', 'lane-wrap');
    const lane = el('div', 'lane');
    if (!list.length) { river.append(wrap); return; }
    // Repeat the list until it is wider than the screen, then double it for a seamless loop.
    let seq = list.slice();
    while (seq.length < Math.max(6, Math.ceil(VB.w / 300))) seq = seq.concat(list);
    seq.concat(seq).forEach((s) => lane.append(chip(s, devId)));
    wrap.append(lane);
    river.append(wrap);
    const L = setupLane(wrap, lane);
    riverLanes.push(L);
    requestAnimationFrame(() => { L.half = lane.scrollWidth / 2; L.offset = Math.random() * L.half * 0.3; });
  });
}

/* ---------- today's City meetings ---------- */
function renderMeetings(m) {
  const box = $('meetings');
  box.textContent = '';
  const list = (m && m.ok && m.meetings) || [];
  box.hidden = !list.length;
  if (!list.length) return;
  const dayLabel = m.is_today ? 'TODAY AT CITY HALL'
    : 'NEXT AT CITY HALL · ' + new Date(m.day + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
  box.append(el('span', 'hd', dayLabel));
  for (const r of list.slice(0, 4)) {
    const item = el('span');
    item.append(document.createTextNode(`${r.time} `));
    const link = r.agenda || r.url;
    if (link) { const a = el('a', null, r.body); a.href = link; a.target = '_blank'; a.rel = 'noopener'; item.append(a); }
    else item.append(document.createTextNode(r.body));
    box.append(item);
  }
}

/* ---------- breaking-news alert: pulses until you click it ---------- */
let currentDev = null;
function acked(id) { try { return id && localStorage.getItem('ackDev') === id; } catch (e) { return false; } }
function applyAlert() {
  const on = !!currentDev && !acked(currentDev.id);
  document.body.classList.toggle('is-dev', on);
  const color = currentDev ? '#E2603C' : '#E3A21A';
  $('clockFace').setAttribute('fill', color);
  $('clockHalo').setAttribute('fill', color);
  $('clockFace').classList.toggle('pulse', on);
  const tag = $('tag');
  tag.querySelector('.dot').classList.toggle('pulse', on);
  tag.classList.toggle('can-ack', on);
  tag.title = on ? 'Click to mark as seen (stops the pulsing)' : '';
  if (currentDev && $('lead').dataset.id === currentDev.id) {
    tag.querySelector('.label').textContent = on ? 'DEVELOPING' : 'DEVELOPING · SEEN';
  }
}
$('tag').addEventListener('click', () => {
  if (!currentDev || acked(currentDev.id)) return;
  try { localStorage.setItem('ackDev', currentDev.id); } catch (e) {}
  applyAlert();
});

/* ---------- "wrong call" reports → GitHub issue → pending test case ---------- */
function repoInfo() {
  const host = location.hostname;
  if (host.endsWith('.github.io')) return { owner: host.split('.')[0], repo: location.pathname.split('/').filter(Boolean)[0] };
  return { owner: 'peetko', repo: 'cincy-news-glance' };
}
function reportLink(s, expect, label) {
  const google = (s.link || '').startsWith('https://news.google.com');
  const c = {
    title: s.title, summary: s.summary || '', link: s.link, outlet: s.outlet,
    google, narrow: google && s.outlet === 'Enquirer', official: s.outlet === 'City of Cincinnati',
    expect, note: `Wrong call reported from the screen, ${new Date().toLocaleDateString('en-US')}`,
  };
  const what = expect.junk ? 'not news' : expect.city ? 'should be City Hall' : 'not City Hall';
  const body = `Reported from the screen (${what}).\n\nWhy it scored the way it did: see the ?debug=1 panel.\n\n\`\`\`json\n${JSON.stringify(c, null, 1)}\n\`\`\`\n`;
  const { owner, repo } = repoInfo();
  const a = el('a', null, label);
  a.href = `https://github.com/${owner}/${repo}/issues/new?title=${encodeURIComponent(`Case: ${what} — ${s.title.slice(0, 80)}`)}&body=${encodeURIComponent(body)}`;
  a.target = '_blank'; a.rel = 'noopener';
  a.title = 'Opens a ready-made GitHub issue. Click "Create" and it becomes a test case automatically.';
  return a;
}

/* ---------- ?debug=1: why each story scored the way it did ---------- */
let debugOn = !!params.get('debug');
function renderDebug(data, leadId) {
  let box = $('debug');
  if (!debugOn) { if (box) box.remove(); return; }
  if (!box) { box = el('div'); box.id = 'debug'; document.body.append(box); }
  box.textContent = '';
  const line = (cls, text) => box.append(el('div', cls, text));
  const close = el('button', null, 'Close ✕');
  close.style.cssText = 'float:right;border:1px solid #A6B9C6;background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer';
  close.addEventListener('click', () => { debugOn = false; renderDebug(data, leadId); });
  box.append(close);
  box.append(el('h3', null, 'Why this screen looks the way it does'));
  line('k', `updated ${clock(data.generated_at)} · mode: ${mode} · lead: ${leadId || '—'}`);
  const w = (data.lead && data.lead.why) || {};
  line('k', `City pick: ${w.city || '—'} · Biggest pick: ${w.general || '—'}`);
  line('k', `breaking-news alert: ${data.developing || 'none'} · river pace ${DRIFT.toFixed(0)} px/s`);
  const sun = solar(new Date());
  line('k', `sunrise ${clock(sun.sunrise)} · sunset ${clock(sun.sunset)} · sun ${sun.elevation.toFixed(0)}° up · scene: ${dayPhase()}`);
  if (data.pending_cases) line('bad', `${data.pending_cases} wrong-call report(s) on the to-fix list (tests/cases.json → pending)`);
  box.append(el('h3', null, 'Sources'));
  for (const s of data.sources_status || []) {
    line(s.ok ? '' : 'bad', `${s.ok ? '✓' : '✗'} ${s.source} — ${s.items} items` +
      (s.junk_dropped ? `, ${s.junk_dropped} dropped as junk` : '') + (s.used_fallback ? ' (via Google News backup)' : '') +
      (s.ok ? '' : ` · ${(s.errors || [s.error]).join('; ')}`) + (s.fail_streak > 1 ? ` · failed ${s.fail_streak} updates in a row` : ''));
  }
  const junk = (data.sources_status || []).flatMap((s) => (s.junk_examples || []).map((t) => `${s.source}: ${t}`));
  if (junk.length) {
    box.append(el('h3', null, 'Dropped as junk (examples)'));
    for (const j of junk) line('k', '✗ ' + j);
  }
  box.append(el('h3', null, `Stories (${(data.stories || []).length}), biggest first`));
  for (const s of data.stories || []) {
    const d = el('div', 'story' + (s.id === leadId ? ' lead' : ''));
    d.append(el('div', 't', s.title));
    const y = s.why || {};
    d.append(el('div', 'k', `overall ${s.score} · City ${s.city_rank} (relevance ${s.city_score}${s.is_city ? ', counts' : ', below 3'}) · ` +
      `${s.outlet_count} outlet(s): ${s.outlets.join(', ')}`));
    d.append(el('div', 'k', `place: ${y.place}${y.place_evidence ? ` (“${y.place_evidence}”)` : ''} · local: ${y.local} · ` +
      `first seen ${ago(s.first_seen)}${y.remembered ? ' (remembered)' : ''}${y.downweighted ? ' · downweighted' : ''}`));
    for (const m of y.matches || []) {
      d.append(el('div', m.note ? 'bad' : '', m.note ? `✗ ${m.note} (${m.outlet})`
        : `+${m.points} ${m.group}: “${m.term}” in ${m.where} (${m.outlet})` + (m.incident ? ` — reduced: incident report (“${m.incident}”)` : '')));
    }
    if (s.developing) d.append(el('div', 'bad', `breaking: ${y.newsrooms_for_alert.length} newsrooms` + (y.breaking_word ? `, word “${y.breaking_word}”` : '')));
    if ((y.versions || []).length > 1) d.append(el('div', 'k', 'grouped: ' + y.versions.map((v) => `${v[0]}: ${v[1]}`).join(' / ')));
    // One click files a GitHub issue that becomes a test case (see .github/workflows/cases.yml).
    const acts = el('div', 'acts');
    if (s.is_city) acts.append(reportLink(s, { city: false }, 'Not City Hall'));
    else acts.append(reportLink(s, { city: true }, 'Should be City Hall'));
    acts.append(reportLink(s, { junk: true }, 'Not news (junk)'));
    d.append(acts);
    box.append(d);
  }
}

/* ---------- game days ----------
   Top right: Bengals / Reds / FC Cincinnati games in the next 5 days (day, opponent, home or away, time).
   Skyline: a team that played in the last 3 days has its stadium glowing in its colors (hover for the score);
   home games light the stadium from 2 hours before the start until the game ends. */
const STADIUM_NAME = { paycor: 'Paycor Stadium', gabp: 'Great American Ball Park', tql: 'TQL Stadium' };
let recentByStadium = {};

function previewGames() {
  const h = 3600e3, now = Date.now();
  const sample = (fav, spread, ou, ml) => ({ provider: 'ESPN BET', details: '', spread, over_under: ou, favorite: fav, moneyline: ml });
  return [
    { team: 'Bengals', stadium: 'paycor', colors: ['#FB4F14', '#000000'], home: true, opponent: 'Steelers', start: new Date(now - 50 * h).toISOString(), state: 'post', score: ['24', '17'], result: 'W' },
    { team: 'FC Cincinnati', stadium: 'tql', colors: ['#F05323', '#263B80'], home: true, opponent: 'Orlando City', start: new Date(now + 54 * h).toISOString(), state: 'pre', odds: sample('us', null, 2.5, [-125, 310]) },
    { team: 'Bengals', stadium: 'paycor', colors: ['#FB4F14', '#000000'], home: false, opponent: 'Ravens', start: new Date(now + 76 * h).toISOString(), state: 'pre', odds: sample('them', 3.5, 47.5, [150, -175]) },
  ];
}

function dayLabel(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const that = new Date(d); that.setHours(0, 0, 0, 0);
  const diff = Math.round((that - today) / 86400e3);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  return new Date(d).toLocaleDateString('en-US', { weekday: 'short' });
}

function resultText(g) {
  const [us, them] = (g.score || []).map((x) => x ?? '');
  const verb = g.result === 'W' ? 'beat' : g.result === 'L' ? 'lost to' : 'tied';
  return `${g.team} ${verb} ${g.opponent} ${us}–${them}${g.home ? '' : ' (away)'} · ${dayLabel(g.start)}`;
}

// "Bengals favored by 3.5 (−175) · Titans +150 · O/U 44.5 · via ESPN BET"
function oddsText(g) {
  const o = g.odds;
  if (!o) return g.state === 'pre' ? ['No betting line posted yet'] : [];
  const sign = (n) => (n == null ? '' : n > 0 ? `+${n}` : `−${Math.abs(n)}`);
  const [usML, themML] = o.moneyline || [];
  const favName = o.favorite === 'us' ? g.team : o.favorite === 'them' ? g.opponent : null;
  const favML = o.favorite === 'us' ? usML : themML;
  const dogName = o.favorite === 'us' ? g.opponent : g.team;
  const dogML = o.favorite === 'us' ? themML : usML;
  const parts = [];
  if (!favName) parts.push('Even matchup (pick ’em)');
  else if (o.spread) parts.push(`${favName} favored by ${o.spread}${favML != null ? ` (${sign(favML)})` : ''}`);
  else parts.push(`${favName} favored${favML != null ? ` (${sign(favML)})` : ''}`);
  const more = [];
  if (favName && dogML != null) more.push(`${dogName} ${sign(dogML)}`);
  if (o.over_under) more.push(`Over/under ${o.over_under}`);
  if (more.length) parts.push(more.join(' · '));
  if (o.provider) parts.push(`Line via ${o.provider}`);
  return parts;
}

function renderGames(games) {
  if (params.get('preview') === 'game') games = previewGames();
  games = games || [];
  const now = Date.now();
  const box = $('games');
  box.textContent = '';

  // Upcoming and live games, soonest first (at most 3 lines).
  const ahead = games.filter((g) => g.state === 'in' || (g.state === 'pre' && new Date(g.start) - now < 5 * 86400e3 && new Date(g.start) > now - 4 * 3600e3));
  for (const g of ahead.slice(0, 3)) {
    const ha = g.home ? 'vs.' : 'at';
    const text = g.state === 'in'
      ? `Live · ${g.team} ${g.score[0]}–${g.score[1]} ${g.opponent} · ${g.detail}`
      : `${dayLabel(g.start)} · ${g.team} ${ha} ${g.opponent} · ${clock(g.start)}`;
    const row = el('span', g.state === 'in' ? 'live' : '');
    const mark = el('span', 'ha');
    const c = (g.colors && g.colors[0]) || '#6F9BB3';
    if (g.home) mark.style.background = c;
    else mark.style.border = `1.5px solid ${c}`;
    const where = g.home ? `Home game at ${STADIUM_NAME[g.stadium] || 'home'}` : `Away game at ${g.opponent}`;
    row.append(mark, document.createTextNode(text));
    // Hover the line or its dot: where it is, plus the betting line.
    row.addEventListener('pointermove', (e) => showTextTip([where, ...oddsText(g)], (g.colors || []).slice(0, 2), e));
    row.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; });
    box.append(row);
  }

  // Lights for home games today; team colors for anyone who played in the last 3 days.
  const lit = new Set();
  recentByStadium = {};
  for (const g of games) {
    const soon = new Date(g.start) - now < 2 * 3600e3;
    if (g.home && g.stadium && (g.state === 'in' || (g.state === 'pre' && soon))) lit.add(g.stadium);
    if (g.state === 'post' && g.stadium && now - new Date(g.start) < 3 * 86400e3) {
      const prev = recentByStadium[g.stadium];
      if (!prev || new Date(g.start) > new Date(prev.start)) recentByStadium[g.stadium] = g;
    }
  }
  for (const id of ['tql', 'paycor', 'gabp']) {
    const st = $('st-' + id);
    st.classList.toggle('lit', lit.has(id));
    const r = recentByStadium[id];
    st.classList.toggle('recent', !!r);
    if (r) { st.style.setProperty('--c1', r.colors[0] || '#FFE2A0'); st.style.setProperty('--c2', r.colors[1] || '#FFFFFF'); }
  }
}

// Tiny lights along each stadium's roofline: mostly the team's main color, every third its second color.
function buildBulbs() {
  for (const id of ['tql', 'paycor', 'gabp']) {
    const st = document.getElementById('st-' + id);
    const rim = st.querySelector('.rim'), layer = st.querySelector('.bulbs');
    const len = rim.getTotalLength(), n = Math.max(5, Math.floor(len / 7));
    for (let i = 0; i < n; i++) {
      const pt = rim.getPointAtLength(((i + 0.5) / n) * len);
      layer.append(svg('circle', { cx: pt.x, cy: pt.y - 1.2, r: 3.2 }, 'h'));
      const b = svg('circle', { cx: pt.x, cy: pt.y - 1.2, r: 1.25 }, 'b' + (i % 3 === 1 ? ' alt' : ''));
      b.style.setProperty('--tw', `${(5 + Math.random() * 4).toFixed(1)}s`);
      b.style.setProperty('--td', `${(-Math.random() * 8).toFixed(1)}s`);
      layer.append(b);
    }
  }
}
buildBulbs();

// A small hover card with a few lines of text (and optional team-color swatches).
function showTextTip(lines, colors, e) {
  const tip = $('tip');
  tip.textContent = '';
  lines.forEach((t, i) => {
    const row = el('div');
    if (i === 0) for (const c of colors || []) { const sw = el('span', 'sw'); sw.style.background = c; sw.style.border = '1px solid #A6B9C6'; row.append(sw); }
    row.append(document.createTextNode(t));
    tip.append(row);
  });
  const stage = $('stage').getBoundingClientRect();
  tip.style.display = 'block';
  const x = (e.clientX - stage.left) / SCALE, y = (e.clientY - stage.top) / SCALE;
  const w = tip.offsetWidth, W = stage.width / SCALE;
  tip.style.left = `${Math.min(W - w - 12, Math.max(8, x - w / 2))}px`;
  tip.style.top = `${y + 18}px`;
}

// Hover card for a glowing stadium.
function showTip(id, e) {
  const g = recentByStadium[id];
  const tip = $('tip');
  if (!g) { tip.style.display = 'none'; return; }
  tip.textContent = '';
  for (const c of (g.colors || []).slice(0, 2)) { const sw = el('span', 'sw'); sw.style.background = c; sw.style.border = '1px solid #A6B9C6'; tip.append(sw); }
  tip.append(document.createTextNode(resultText(g)));
  const stage = $('stage').getBoundingClientRect();
  tip.style.display = 'block';
  const x = (e.clientX - stage.left) / SCALE, y = (e.clientY - stage.top) / SCALE;
  tip.style.left = `${Math.max(8, x - tip.offsetWidth / 2)}px`;
  tip.style.top = `${y - tip.offsetHeight - 14}px`;
}
for (const id of ['tql', 'paycor', 'gabp']) {
  const st = document.getElementById('st-' + id);
  st.addEventListener('pointermove', (e) => showTip(id, e));
  st.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; });
}

/* ---------- timer renewal reminder (last 30 days before the token expires) ---------- */
function renderReminder(expires) {
  const r = $('reminder');
  r.textContent = '';
  if (!expires) return;
  const days = Math.ceil((new Date(expires + 'T23:59:00') - Date.now()) / 86400e3);
  if (days > 30) return;
  const date = new Date(expires + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  r.textContent = days >= 0 ? `Renew the update timer's GitHub token by ${date}` : `Update timer token expired ${date} — renew it`;
}

/* ---------- the occasional boat ---------- */
function spawnBoat() {
  if (REDUCED || document.hidden) return;
  const layer = $('boats');
  const rightward = Math.random() < 0.5;
  const kind = Math.random() < 0.55 ? 'paddle' : 'barge';
  const g = svg('g', { opacity: 0.85 });
  const inner = svg('g', rightward ? {} : { transform: 'scale(-1,1)' });
  if (kind === 'paddle') {
    // Riverboat: hull, two white decks, twin stacks, red stern wheel.
    inner.append(svg('polygon', { points: '2,612 64,612 70,604 -2,604', fill: '#6F8494' }));
    inner.append(svg('rect', { x: 6, y: 598, width: 52, height: 6, fill: '#F1F4F6' }));
    inner.append(svg('rect', { x: 14, y: 593, width: 34, height: 5, fill: '#E6EBEF' }));
    inner.append(svg('rect', { x: 22, y: 584, width: 3, height: 9, fill: '#5E6E7A' }));
    inner.append(svg('rect', { x: 30, y: 584, width: 3, height: 9, fill: '#5E6E7A' }));
    inner.append(svg('circle', { cx: -4, cy: 605, r: 6, fill: 'none', stroke: '#B5483A', 'stroke-width': 2, opacity: 0.8 }));
  } else {
    // Towboat pushing three barges, the Ohio's everyday traffic.
    for (let i = 0; i < 3; i++) inner.append(svg('rect', { x: 30 + i * 49, y: 605, width: 46, height: 7, fill: '#8E7D69' }));
    inner.append(svg('rect', { x: 0, y: 603, width: 28, height: 9, fill: '#6F8494' }));
    inner.append(svg('rect', { x: 4, y: 595, width: 14, height: 8, fill: '#E6EBEF' }));
    inner.append(svg('rect', { x: 7, y: 590, width: 8, height: 5, fill: '#D6DEE4' }));
  }
  g.append(inner);
  layer.append(g);
  const from = rightward ? VB.x - 220 : VB.x + VB.w + 220;
  const to = rightward ? VB.x + VB.w + 220 : VB.x - 220;
  const anim = g.animate([{ transform: `translate(${from}px, 0)` }, { transform: `translate(${to}px, 0)` }],
    { duration: (VB.w / 1200) * (kind === 'paddle' ? 260e3 : 340e3), easing: 'linear' });
  anim.onfinish = () => g.remove();
}
function scheduleBoats() {
  const first = params.get('boats') === 'now' ? 500 : (40 + Math.random() * 80) * 1000;
  setTimeout(function next() { spawnBoat(); setTimeout(next, (6 + Math.random() * 8) * 60e3); }, first);
}

/* ---------- ‹ › the top three stories ----------
   City Hall mode: the three biggest City stories. Biggest mode: the three biggest overall.
   A breaking story always stays #1. After 2 minutes without a click it returns to #1. */
let topList = [], topIdx = 0, topCtx = null, topTimer = null;

function buildTopList(stories, first, rankKey, onlyCity) {
  // National policy stories stay in the river: never the lead, never in the top three.
  const pool = stories.filter((s) => s !== first && !s.national && (!onlyCity || s.is_city)).sort((a, b) => b[rankKey] - a[rankKey]);
  return [first, ...pool].filter(Boolean).slice(0, 3);
}

function updatePager() {
  const pager = $('pager');
  pager.hidden = topList.length < 2;
  $('pos').textContent = `${topIdx + 1} / ${topList.length}`;
}

function showTop(i, animate = true) {
  if (!topList.length) return;
  topIdx = (i + topList.length) % topList.length;
  const story = topList[topIdx];
  const draw = () => {
    renderLead(story, topCtx.devId === story.id, topIdx === 0 && topCtx.noCityNews);
    $('lead').dataset.id = story.id;
    applyAlert();
    updatePager();
    $('lead').classList.remove('fading');
  };
  if (animate) { $('lead').classList.add('quick', 'fading'); setTimeout(() => { draw(); setTimeout(() => $('lead').classList.remove('quick'), 350); }, 300); }
  else draw();
  clearTimeout(topTimer);
  if (topIdx !== 0) topTimer = setTimeout(() => showTop(0), 120000);
}
$('prev').addEventListener('click', () => showTop(topIdx - 1));
$('next').addEventListener('click', () => showTop(topIdx + 1));

/* ---------- whole screen ---------- */
function render(data) {
  renderWeather(data.weather);
  const stories = data.stories || [];
  $('empty').style.display = stories.length ? 'none' : 'block';
  $('lead').style.display = stories.length ? 'flex' : 'none';

  lastData = data;
  const byId = (id) => (id ? stories.find((s) => s.id === id) : null);
  const devStory = byId(data.developing);
  // A developing story always leads. Otherwise the switch decides.
  const cityPick = byId(data.lead && data.lead.city) || stories.find((s) => s.is_city && !s.national);
  const generalPick = byId(data.lead && data.lead.general) || stories.find((s) => !s.national);
  const noCityNews = mode === 'city' && !cityPick;
  const lead = devStory || (mode === 'city' ? cityPick || generalPick : generalPick);
  currentDev = devStory;
  renderMeetings(data.meetings);
  renderGames(data.games);
  renderReminder(data.timer_token_expires);
  renderDebug(data, lead && lead.id);

  const c = data.counts || {};
  const counts = $('counts');
  counts.textContent = `${c.stories ?? stories.length} stories · `;
  counts.insertAdjacentHTML('beforeend', HALL_ICON);
  counts.append(document.createTextNode(`${c.city ?? 0} for City Hall`));
  if (c.city_national) {
    const nat = el('span', null, ` (+${c.city_national} national)`);
    nat.style.opacity = '0.75';
    nat.title = 'National policy stories that touch local government: in the river only, never the lead';
    counts.append(nat);
  }
  const age = (Date.now() - new Date(data.generated_at)) / 60000;
  const upd = $('updated');
  const when = new Date(data.generated_at);
  const sameDay = when.toDateString() === new Date().toDateString();
  upd.textContent = age > 60
    ? `● last update ${sameDay ? '' : when.toLocaleDateString('en-US', { weekday: 'short' }) + ' '}${clock(data.generated_at)}`
    : '';
  upd.className = age > 60 ? 'stale' : '';

  // Only rebuild the moving parts when the news actually changed (keeps the river smooth).
  const key = stories.map((s) => s.id + s.outlet_count).join('|') + data.developing + mode + (lead && lead.id);
  if (key === lastKey) { applyAlert(); return; }
  const first = !lastKey;
  lastKey = key;
  if (!lead) return;
  const cityMode = mode === 'city' && !noCityNews;
  const swap = () => {
    // The list the arrows flip through. If you were looking at #2 or #3 and it's still in the list, stay on it.
    const showing = topList[topIdx] && topList[topIdx].id;
    topList = buildTopList(stories, lead, cityMode ? 'city_rank' : 'score', cityMode);
    topCtx = { devId: devStory && devStory.id, noCityNews };
    const keep = topList.findIndex((s) => s.id === showing);
    showTop(keep > 0 ? keep : 0, false);
    renderRiver(stories.filter((s) => s !== lead), devStory && devStory.id);
  };
  if (first) swap();
  else { $('lead').classList.add('fading'); setTimeout(swap, 1200); }
}

// Sample files were captured once; slide their timestamps up to "now" so the ages read naturally.
function shiftSampleTimes(data) {
  const offset = Date.now() - new Date(data.generated_at).getTime();
  const shift = (iso) => new Date(new Date(iso).getTime() + offset).toISOString();
  data.generated_at = shift(data.generated_at);
  for (const s of data.stories || []) { s.first_seen = shift(s.first_seen); s.updated = shift(s.updated); }
}

let siteVersion = null;

async function load() {
  try {
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    // New page design published? Reload once to pick it up (the open tab otherwise keeps the old code).
    if (data.site_version && data.site_version !== 'local') {
      if (siteVersion && data.site_version !== siteVersion) { location.reload(); return; }
      siteVersion = data.site_version;
    }
    if (params.get('sample')) shiftSampleTimes(data);
    render(data);
  } catch (e) {
    console.warn('news.json not available yet', e);
    if (!lastKey) $('empty').style.display = 'block';
  }
}

/* Keep the laptop screen awake while this page is showing (Chrome / Edge). */
async function stayAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); }
  catch (e) { /* not supported or not allowed: no problem */ }
}

document.querySelectorAll('#mode button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('crown').addEventListener('click', () => {
  debugOn = !debugOn;
  if (lastData) renderDebug(lastData, $('lead').dataset.id);
});
setMode(mode);
addEventListener('resize', fit);
document.addEventListener('visibilitychange', stayAwake);
fit(); tickClock(); load(); stayAwake();
setInterval(tickClock, 15000);
scheduleBoats();
setInterval(load, REFRESH_MS);
</script>
